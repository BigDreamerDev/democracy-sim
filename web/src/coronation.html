<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Coronation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gloock&display=block" rel="stylesheet">
<style>
  :root { --night:#0E0B0A; --night2:#1A1210; --gold:#E3C16F; --gold2:#F6E7B4; --gold3:#A9792A; --cream:#F4EFE3; --ox:#7A1F1F; --ox2:#4E1212;
    --serif:'Gloock','Iowan Old Style',Georgia,serif; --sans:'Atkinson Hyperlegible','Segoe UI',sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--night); color:var(--cream); overflow:hidden; font-family:var(--sans); }
  #stage { position:fixed; inset:0; display:grid; place-items:center; overflow:hidden; background:radial-gradient(ellipse at 50% 46%, #2A1A14 0%, var(--night2) 38%, var(--night) 78%); }
  #stage.play .cam { animation:cam 24s linear both; }
  @keyframes cam { from { transform:scale(1); } to { transform:scale(1.07); } }
  .cam { position:absolute; inset:0; display:grid; place-items:center; }

  /* the sunburst behind everything */
  #rays { position:absolute; width:190vmax; height:190vmax; left:50%; top:46%; translate:-50% -50%; opacity:0;
    background:repeating-conic-gradient(from 0deg, rgba(227,193,111,.11) 0 4deg, transparent 4deg 12deg);
    -webkit-mask-image:radial-gradient(circle, #000 0, rgba(0,0,0,.55) 22%, transparent 58%); mask-image:radial-gradient(circle, #000 0, rgba(0,0,0,.55) 22%, transparent 58%); }
  .play #rays { animation:raysIn 3s ease 6.9s both, spin 90s linear 6.9s infinite; }
  @keyframes raysIn { to { opacity:1; } } @keyframes spin { to { rotate:360deg; } }

  /* opening lines */
  .open { position:absolute; left:0; right:0; top:46%; translate:0 -50%; text-align:center; padding:0 6vw; }
  .rule { height:1px; width:min(60vw,520px); margin:0 auto; background:linear-gradient(90deg, transparent, var(--gold), transparent); transform:scaleX(0); }
  .play .rule { animation:ruleIn 1.4s cubic-bezier(.2,.8,.3,1) .3s both, out .8s ease 3.6s forwards; }
  @keyframes ruleIn { to { transform:scaleX(1); } }
  .kick { font-weight:700; font-size:clamp(11px,1.6vmin,15px); letter-spacing:.34em; text-transform:uppercase; color:var(--gold); opacity:0; margin:18px 0; }
  .play .kick { animation:up 1s ease .9s both, out .8s ease 3.6s forwards; }
  .by { font-family:var(--serif); font-size:clamp(22px,4.6vmin,44px); opacity:0; }
  .play .by { animation:up 1.2s ease 1.5s both, out .8s ease 3.6s forwards; }
  @keyframes up { from { opacity:0; transform:translateY(14px); filter:blur(4px); } to { opacity:1; transform:none; filter:none; } }
  @keyframes out { to { opacity:0; } }

  /* the seal: guilloche rings that draw themselves */
  #seal { position:absolute; left:50%; top:46%; width:min(62vmin,560px); aspect-ratio:1; translate:-50% -50%; overflow:visible; }
  #seal path { fill:none; stroke:var(--gold); stroke-width:.5; stroke-dasharray:1; stroke-dashoffset:1; opacity:.9; }
  .play #seal path { animation:draw 3.2s cubic-bezier(.5,0,.2,1) both; animation-delay:calc(4.1s + var(--i) * .22s); }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .play #seal { animation:sealTurn 60s linear 4.1s infinite, sealRise 2.2s cubic-bezier(.3,0,.2,1) 11.6s forwards; }
  @keyframes sealTurn { to { rotate:360deg; } }
  @keyframes sealRise { to { top:23%; width:min(34vmin,300px); opacity:.85; } }
  #disc { position:absolute; left:50%; top:46%; width:min(40vmin,360px); aspect-ratio:1; translate:-50% -50%; border-radius:50%; opacity:0;
    background:radial-gradient(circle at 50% 40%, #8E2A22, var(--ox2) 70%); box-shadow:0 0 0 2px var(--gold3), 0 0 60px rgba(227,193,111,.25); }
  .play #disc { animation:discIn 1.6s ease 6.2s both, discRise 2.2s cubic-bezier(.3,0,.2,1) 11.6s forwards; }
  @keyframes discIn { from { opacity:0; scale:.8; } to { opacity:1; scale:1; } }
  @keyframes discRise { to { top:23%; width:min(22vmin,196px); } }

  /* the crown comes down */
  #crown { position:absolute; left:50%; top:46%; width:min(30vmin,270px); translate:-50% -56%; opacity:0; filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)); }
  .play #crown { animation:crownDown 2.2s cubic-bezier(.2,.7,.2,1) 7.2s both, crownRise 2.2s cubic-bezier(.3,0,.2,1) 11.6s forwards; }
  @keyframes crownDown { 0% { opacity:0; transform:translateY(-70vh) rotate(-8deg); } 12% { opacity:1; } 78% { transform:translateY(10px) rotate(0); } 88% { transform:translateY(-7px); } 100% { opacity:1; transform:none; } }
  @keyframes crownRise { to { top:23%; width:min(16.5vmin,148px); } }
  #flash { position:absolute; left:50%; top:46%; width:10vmin; aspect-ratio:1; translate:-50% -50%; border-radius:50%; border:2px solid var(--gold2); opacity:0; }
  .play #flash { animation:flash 1.6s ease-out 8.95s forwards; }
  @keyframes flash { 0% { opacity:.95; scale:1; } 100% { opacity:0; scale:14; } }
  #white { position:absolute; inset:0; background:radial-gradient(circle at 50% 46%, rgba(246,231,180,.75), transparent 60%); opacity:0; pointer-events:none; }
  .play #white { animation:white 1.1s ease-out 8.95s forwards; }
  @keyframes white { 0% { opacity:.9; } 100% { opacity:0; } }

  /* the name */
  .name { position:absolute; left:0; right:0; top:46%; text-align:center; padding:0 4vw; }
  .crowned { font-weight:700; font-size:clamp(11px,1.7vmin,16px); letter-spacing:.42em; text-transform:uppercase; color:var(--gold); opacity:0; }
  .play .crowned { animation:up 1s ease 12.3s both; }
  h1 { margin:.12em 0 .1em; font-family:var(--serif); font-weight:400; line-height:1; font-size:clamp(54px,15vmin,170px); letter-spacing:.01em; white-space:nowrap; }
  h1 span { display:inline-block; opacity:0; background:linear-gradient(100deg, var(--gold3) 0%, var(--gold) 28%, var(--gold2) 46%, #fff 50%, var(--gold2) 54%, var(--gold) 72%, var(--gold3) 100%); background-size:300% 100%; background-position:100% 0;
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .play h1 span { animation:letter 1.1s cubic-bezier(.2,.8,.2,1) both, shine 3.6s ease 14.6s both; animation-delay:calc(12.9s + var(--i) * .11s), 14.6s; }
  @keyframes letter { from { opacity:0; transform:translateY(.35em) scale(1.12); filter:blur(8px); } to { opacity:1; transform:none; filter:none; } }
  @keyframes shine { to { background-position:0 0; } }
  .flourish { width:min(70vw,460px); margin:0 auto; display:block; overflow:visible; }
  .flourish path { fill:none; stroke:var(--gold); stroke-width:1.2; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; }
  .play .flourish path { animation:draw 1.8s ease 14.2s both; }
  .style { font-family:var(--serif); font-size:clamp(17px,3.3vmin,32px); margin-top:.5em; opacity:0; color:var(--cream); }
  .play .style { animation:up 1.2s ease 14.9s both; }

  /* the ribbon */
  .ribbon { position:relative; display:inline-block; margin-top:1.5em; }
  .ribbon b { display:block; position:relative; padding:.62em 2.2em .56em; font-family:var(--serif); font-weight:400; font-size:clamp(17px,3.5vmin,34px); letter-spacing:.14em; text-transform:uppercase; white-space:nowrap;
    color:var(--gold2); background:linear-gradient(180deg, #8E2A22, var(--ox) 55%, var(--ox2)); border-top:1px solid rgba(246,231,180,.5); border-bottom:1px solid rgba(0,0,0,.4);
    clip-path:inset(0 50% 0 50%); box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .play .ribbon b { animation:unfurl 1.5s cubic-bezier(.2,.8,.2,1) 16.4s both; }
  @keyframes unfurl { to { clip-path:inset(0 0 0 0); } }
  .ribbon i { position:absolute; top:.5em; width:2.4em; height:100%; background:var(--ox2); opacity:0; z-index:-1; }
  .ribbon i.l { left:-1.5em; clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 34% 50%); } .ribbon i.r { right:-1.5em; clip-path:polygon(0 0, 100% 0, 66% 50%, 100% 100%, 0 100%); }
  .play .ribbon i { animation:raysIn .6s ease 17.5s both; }
  .foot { position:absolute; left:0; right:0; bottom:5.5%; text-align:center; font-size:clamp(10px,1.5vmin,14px); letter-spacing:.3em; text-transform:uppercase; color:rgba(244,239,227,.7); opacity:0; }
  .play .foot { animation:up 1.2s ease 18.2s both; }

  canvas#gilt { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.6) 100%); }
  #grain { position:absolute; inset:-50%; pointer-events:none; opacity:.07; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation:grain 1.2s steps(6) infinite; }
  @keyframes grain { to { transform:translate(6%, -4%); } }
  #black { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; }
  .auto.play #black { animation:raysIn 1.6s ease 22.3s both; }

  /* the summons and the end card (not in the recording) */
  .card { position:absolute; inset:0; display:grid; place-items:center; padding:6vw; background:rgba(14,11,10,.92); z-index:5; transition:opacity .8s ease; }
  .card.gone { opacity:0; pointer-events:none; }
  .card > div { max-width:520px; text-align:center; border:1px solid var(--gold3); outline:1px solid var(--gold3); outline-offset:6px; padding:clamp(22px,5vmin,44px); background:linear-gradient(180deg, #1F1512, #140E0C); }
  .card .k { font-weight:700; font-size:12px; letter-spacing:.34em; text-transform:uppercase; color:var(--gold); }
  .card h2 { font-family:var(--serif); font-weight:400; font-size:clamp(26px,5.4vmin,44px); line-height:1.1; margin:.4em 0; }
  .card p { color:rgba(244,239,227,.8); margin:0 0 1.4em; line-height:1.5; }
  .btn { font:700 15px var(--sans); letter-spacing:.08em; text-transform:uppercase; color:#1A1210; background:linear-gradient(180deg, var(--gold2), var(--gold)); border:1px solid var(--gold3); border-radius:2px; padding:12px 22px; cursor:pointer; box-shadow:0 4px 0 var(--gold3); }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--gold3); }
  .btn.ghost { background:transparent; color:var(--gold); box-shadow:none; margin-left:8px; }
  #end { background:transparent; align-items:end; padding-bottom:3vh; } #end > div { border:0; outline:0; background:transparent; padding:0; }
  @media (prefers-reduced-motion: reduce) { #stage * { animation-duration:.01s !important; animation-delay:0s !important; } }
</style>
</head>
<body>
<div id="stage">
  <div class="cam">
    <div id="rays"></div>
    <div class="open"><div class="rule"></div><div class="kick" id="kick"></div><div class="by" id="by"></div><div class="rule" style="margin-top:22px"></div></div>
    <svg id="seal" viewBox="0 0 200 200" aria-hidden="true"></svg>
    <div id="disc"></div>
    <svg id="crown" viewBox="0 0 200 150" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9EEC4"/><stop offset=".45" stop-color="#E3C16F"/><stop offset="1" stop-color="#9C6E22"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E7B4"/><stop offset="1" stop-color="#B88A2E"/></linearGradient>
      </defs>
      <path d="M32 106 L18 46 L60 80 L100 20 L140 80 L182 46 L168 106 Z" fill="url(#g)" stroke="#6E4A14" stroke-width="2" stroke-linejoin="round"/>
      <path d="M46 100 L38 64 L62 86 Z M154 100 L162 64 L138 86 Z M100 44 L84 92 L116 92 Z" fill="#7A1F1F" opacity=".85"/>
      <rect x="28" y="106" width="144" height="24" rx="4" fill="url(#g2)" stroke="#6E4A14" stroke-width="2"/>
      <g fill="#7A1F1F" stroke="#F6E7B4" stroke-width="1"><path d="M100 110 l7 8 -7 8 -7 -8z"/><path d="M64 111 l5 7 -5 7 -5 -7z"/><path d="M136 111 l5 7 -5 7 -5 -7z"/></g>
      <g fill="#F4EFE3"><circle cx="44" cy="118" r="3"/><circle cx="82" cy="118" r="3"/><circle cx="118" cy="118" r="3"/><circle cx="156" cy="118" r="3"/></g>
      <g fill="url(#g)" stroke="#6E4A14" stroke-width="1.6"><circle cx="18" cy="42" r="7"/><circle cx="182" cy="42" r="7"/><circle cx="60" cy="76" r="5"/><circle cx="140" cy="76" r="5"/><circle cx="100" cy="14" r="9"/></g>
      <path d="M100 0 v10 M95 5 h10" stroke="#F6E7B4" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div id="flash"></div>
    <div class="name">
      <div class="crowned" id="crowned"></div>
      <h1 id="who"></h1>
      <svg class="flourish" viewBox="0 0 460 26" aria-hidden="true"><path pathLength="1" d="M10 13 H180 C196 13 200 3 212 3 C224 3 226 13 230 13 C234 13 236 3 248 3 C260 3 264 13 280 13 H450"/><path pathLength="1" d="M222 20 l8 -7 8 7 -8 5z"/></svg>
      <div class="style" id="style"></div>
      <div class="ribbon"><i class="l"></i><i class="r"></i><b id="long"></b></div>
    </div>
    <div class="foot" id="foot"></div>
  </div>
  <canvas id="gilt"></canvas>
  <div id="white"></div>
  <div id="vignette"></div><div id="grain"></div><div id="black"></div>
  <div class="card" id="summons"><div><div class="k">A summons</div><h2 id="sumh"></h2><p id="sump"></p><button class="btn" id="go">Attend</button><button class="btn ghost" id="quiet">Attend in silence</button></div></div>
  <div class="card gone" id="end"><div><button class="btn" id="again">Watch again</button><button class="btn ghost" id="enter">Enter the realm</button></div></div>
</div>
<script>
'use strict';
const q = new URLSearchParams(location.search || window.name || '');
const NAME = (q.get('name') || 'Erik').slice(0, 18), NUM = (q.get('numeral') ?? 'I').slice(0, 5), TITLE = (q.get('title') || 'King').slice(0, 14);
const REALM = (q.get('realm') || 'Kingdom of Aldmere').slice(0, 40), DATE = (q.get('date') || '16 November 2026').slice(0, 30), AUTO = q.get('auto') === '1';
const place = (q.get('place') || REALM.split(' of ')[1] || REALM).slice(0, 40), PM = q.get('pm') === '1';
const $ = (id) => document.getElementById(id);
$('by').textContent = PM ? 'By Act of Parliament' : 'By the choice of the realm';
$('kick').textContent = `${REALM} · ${DATE}`;
$('crowned').textContent = `Crowned ${TITLE}`;
$('who').innerHTML = [...(NAME + (NUM ? ' ' + NUM : ''))].map((c, i) => `<span style="--i:${i}">${c === ' ' ? '&nbsp;' : c.replace(/[&<>]/g, '')}</span>`).join('');
$('style').textContent = PM ? `${TITLE} and Prime Minister of ${place}` : `${TITLE} of ${place}`;
$('long').textContent = `Long live the ${TITLE}`;
$('foot').textContent = `Crowned ${DATE} · ${REALM}`;
$('sumh').textContent = `The coronation of ${NAME}${NUM ? ' ' + NUM : ''}`;
$('sump').textContent = PM ? `By the Crown Act, the ${TITLE} is crowned and takes the government of ${place}. Every citizen is summoned to witness it.` : `The ${TITLE} of ${place} is crowned. Every citizen is summoned to witness it.`;

// the seal's guilloche, the same curve the Realm stamps on everything
function ring(c, base, amp, lobes, phase) { let d = ''; for (let i = 0; i <= 360; i++) { const t = (i / 360) * Math.PI * 2, r = base + amp * Math.sin(lobes * t + phase); d += (i ? 'L' : 'M') + (c + r * Math.cos(t)).toFixed(2) + ' ' + (c + r * Math.sin(t)).toFixed(2); } return d + 'Z'; }
$('seal').innerHTML = [[92, 5, 24, 0], [86, 6, 24, 1.1], [80, 5, 16, .4], [74, 6, 16, 1.6], [67, 3, 32, 0], [96.5, .01, 1, 0], [61, .01, 1, 0]].map(([b, a, l, p], i) => `<path pathLength="1" style="--i:${i}" d="${ring(100, b, a, l, p)}"/>`).join('');

// gilt: slow gold leaf, falling after the crown lands
const cv = $('gilt'), cx = cv.getContext('2d'); let flakes = [], t0 = 0, raf = 0;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', size); size();
let seed = 7; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
function gilt(now) {
  const t = (now - t0) / 1000; cx.clearRect(0, 0, cv.width, cv.height);
  if (t > 9 && t < 23 && flakes.length < 170 && rnd() < .55) flakes.push({ x: rnd() * cv.width, y: -20, s: (3 + rnd() * 7) * devicePixelRatio, vy: (26 + rnd() * 60) * devicePixelRatio, sw: rnd() * 6.28, sp: .6 + rnd() * 1.8, r: rnd() * 6.28, c: ['#F6E7B4', '#E3C16F', '#B88A2E', '#FFF6D8'][Math.floor(rnd() * 4)], born: t });
  const fade = t > 21.5 ? Math.max(0, 1 - (t - 21.5) / 1.5) : 1;
  flakes.forEach((f) => {
    const a = t - f.born; const y = f.y + f.vy * a, x = f.x + Math.sin(f.sw + a * f.sp) * 26 * devicePixelRatio;
    cx.save(); cx.translate(x, y); cx.rotate(f.r + a * f.sp); cx.scale(1, Math.abs(Math.cos(a * f.sp * 1.7)) * .9 + .1);
    cx.globalAlpha = Math.min(1, a * 2) * .9 * fade; cx.fillStyle = f.c; cx.fillRect(-f.s / 2, -f.s / 2, f.s, f.s * .62); cx.restore();
  });
  flakes = flakes.filter((f) => f.y + f.vy * (t - f.born) < cv.height + 40);
  if (t < 60) raf = requestAnimationFrame(gilt);
}

// the score: a drone, a rising shimmer, timpani and the great bell as the crown lands, then the fanfare
function score(ac, at) {
  const out = ac.createGain(); out.gain.value = .5;
  const comp = ac.createDynamicsCompressor(); out.connect(comp); comp.connect(ac.destination);
  // a little hall: two feedback delays
  [[.19, .34], [.31, .28]].forEach(([d, g]) => { const dl = ac.createDelay(1); dl.delayTime.value = d; const fb = ac.createGain(); fb.gain.value = g; out.connect(dl); dl.connect(fb); fb.connect(dl); fb.connect(comp); });
  const env = (g, t, a, peak, hold, rel) => { g.gain.setValueAtTime(0.0001, at + t); g.gain.exponentialRampToValueAtTime(peak, at + t + a); g.gain.setValueAtTime(peak, at + t + a + hold); g.gain.exponentialRampToValueAtTime(0.0001, at + t + a + hold + rel); };
  const tone = (type, f, t, a, peak, hold, rel, cutoff) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; const g = ac.createGain(); let n = o; if (cutoff) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(cutoff * .5, at + t); lp.frequency.exponentialRampToValueAtTime(cutoff, at + t + a + .05); lp.Q.value = .7; o.connect(lp); n = lp; } n.connect(g); g.connect(out); env(g, t, a, peak, hold, rel); o.start(at + t); o.stop(at + t + a + hold + rel + .1); return o; };
  // drone
  [55, 55.4, 82.4, 110].forEach((f, i) => tone('sawtooth', f, 0, 3.5, i < 2 ? .16 : .07, 14, 5, 220));
  // shimmer as the seal draws
  [880, 1108.7, 1318.5, 1760].forEach((f, i) => tone('sine', f, 4.2 + i * .45, 1.6, .035, .6, 2.4));
  // timpani roll into the landing, then the stroke
  for (let i = 0; i < 14; i++) tone('sine', 73.4, 7.6 + i * .095, .01, .05 + i * .012, .02, .18);
  const hit = (t, f, peak) => { const o = tone('sine', f, t, .008, peak, .05, 1.6); o.frequency.setValueAtTime(f * 1.6, at + t); o.frequency.exponentialRampToValueAtTime(f, at + t + .12); };
  hit(8.95, 55, .9); hit(8.95, 73.4, .5);
  // the great bell
  const bell = (t, f, peak, len) => [[.5, 1], [1, .9], [1.19, .55], [1.5, .4], [2, .5], [2.51, .3], [2.67, .22], [3.01, .2], [4.1, .12]].forEach(([m, a]) => tone('sine', f * m, t, .006, peak * a, .02, len / (m * .55 + .45)));
  bell(8.97, 196, .34, 7); bell(13.0, 293.7, .16, 5); bell(16.5, 392, .13, 5); bell(18.4, 293.7, .11, 5); bell(20.2, 196, .12, 6);
  // brass: saw and square together, opening as they swell
  const brass = (f, t, len, peak) => { tone('sawtooth', f, t, .07, peak, len, .5, 2600); tone('square', f * 1.003, t, .09, peak * .35, len, .5, 1500); tone('sawtooth', f * .5, t, .1, peak * .5, len, .6, 900); };
  const D4 = 293.66, Fs4 = 369.99, A4 = 440, D5 = 587.33, Fs5 = 739.99, A5 = 880, G4 = 392, B4 = 493.88, E5 = 659.25;
  [[D4, 12.3, .13], [D4, 12.52, .13], [D4, 12.74, .13]].forEach(([f, t, l]) => brass(f, t, l, .12));
  [[D4, .16], [Fs4, .12], [A4, .16]].forEach(([f, p]) => brass(f, 12.96, 1.5, p));
  [[G4, .12], [B4, .12], [D5, .15]].forEach(([f, p]) => brass(f, 14.7, .7, p));
  [[A4, .12], [D5, .13], [E5, .13]].forEach(([f, p]) => brass(f, 15.55, .7, p));
  [[D4, .13], [A4, .12], [D5, .15], [Fs5, .13], [A5, .1]].forEach(([f, p]) => brass(f, 16.4, 4.2, p));
  tone('sawtooth', 36.7, 16.4, .4, .2, 4, 2.2, 160);
