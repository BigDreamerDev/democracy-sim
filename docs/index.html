<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Republic</title>
<meta name="description" content="Elections, bills and the statute book for one group chat.">
<meta name="theme-color" content="#E9EAEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161C" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Republic">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-flag" id="gateFlag"></div>
    <h1 class="gate-title" id="gateName">The Republic</h1>
    <p class="gate-sub">Registered citizens only.</p>

    <div class="tabs" role="tablist">
      <button class="tab is-on" data-gate="in" role="tab">Sign in</button>
      <button class="tab" data-gate="up" role="tab">Register</button>
    </div>

    <form id="formIn" class="stack">
      <label class="field"><span>Username</span><input name="username" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>

    <form id="formUp" class="stack" hidden>
      <label class="field"><span>Invite code</span><input name="invite" placeholder="Leave blank if you are the founder"></label>
      <label class="field"><span>Username</span><input name="username" autocomplete="username" required></label>
      <label class="field"><span>Display name</span><input name="display_name" placeholder="How you appear in the chamber"></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="new-password" required></label>
      <button class="btn btn-primary" type="submit">Claim citizenship</button>
    </form>

    <p class="gate-msg" id="gateMsg" role="status"></p>
  </div>
</div>

<div id="shell" hidden>
  <header class="topbar">
    <a class="brand" href="#/chamber">
      <span class="brand-seal" aria-hidden="true"></span>
      <span class="brand-text"><strong id="navName">The Republic</strong><em id="navMotto"></em></span>
    </a>
    <div class="whoami">
      <a href="#/me" id="whoName">—</a>
      <span class="who-role" id="whoRole" hidden></span>
      <button class="btn btn-ghost btn-sm" id="themeBtn" title="Light, dark, or follow the phone" aria-label="Change theme">◐</button>
      <button class="btn btn-ghost btn-sm" id="signout">Sign out</button>
    </div>
  </header>

  <nav class="rail" id="rail"></nav>

  <div id="emergency" hidden></div>

  <main id="view" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="config.js"></script>
<script>
  /* Theme is applied before the stylesheet paints, so an install opening in dark
     never flashes white first. */
  (function () {
    var t = localStorage.getItem('republic.theme') || 'auto';
    document.documentElement.dataset.theme = t;
  })();
  if ('serviceWorker' in navigator) {
    addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
<script src="app.js"></script>
<script src="world-map.js"></script>
<script src="acts.js"></script>
<script src="money.js"></script>
<script src="press.js"></script>
</body>
</html>
