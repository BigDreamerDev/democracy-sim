<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFCF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18232A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Console">
<link rel="manifest" href="console.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Realm Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gloock&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0E8;--card:#FBFCF8;--field:#fff;--ink:#1B2430;--mut:#4A5560;--line:#C3CFC0;--soft:#E1E6DC;--acc:#1F5E57;--acc2:#E4ECE8;--onacc:#FBFCF8;--ok:#1F6B45;--okbg:#E1EFE4;--bad:#A8321F;--badbg:#F3E3DF;--warn:#8A4B14;--warnbg:#F3E8D6;--hh:92px;
  --serif:'Gloock','Iowan Old Style','Palatino Linotype',Georgia,serif;--sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11191E;--card:#18232A;--field:#121B21;--ink:#E3E8DE;--mut:#A7B2AC;--line:#33443F;--soft:#22302E;--acc:#74BCAC;--acc2:#1B2F2B;--onacc:#0E1518;--ok:#7CCB9A;--okbg:#17302A;--bad:#E7836E;--badbg:#35211D;--warn:#E39A60;--warnbg:#2B261D}}
:root[data-theme=dark]{--bg:#11191E;--card:#18232A;--field:#121B21;--ink:#E3E8DE;--mut:#A7B2AC;--line:#33443F;--soft:#22302E;--acc:#74BCAC;--acc2:#1B2F2B;--onacc:#0E1518;--ok:#7CCB9A;--okbg:#17302A;--bad:#E7836E;--badbg:#35211D;--warn:#E39A60;--warnbg:#2B261D}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hh) + 12px)}
body{margin:0;font:16px/1.5 var(--sans);background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--ink)}
.top{display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.top h1{font:400 22px/1.1 var(--serif);margin:0 6px 0 0}
.top .me{margin-left:auto;font-size:13.5px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--ink);white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.live{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}.live.on{background:var(--ok);box-shadow:0 0 0 3px var(--okbg)}.live.wait{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
kbd{font:12px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card);color:var(--mut)}
code{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;border-radius:0;color:var(--mut);font-weight:700;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
nav .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11.5px;padding:0 6px;margin-left:5px}
main{max-width:1080px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font:400 19px/1.2 var(--serif);margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 .sub{font:400 13.5px var(--sans);color:var(--mut)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.fields{display:grid;gap:10px;align-items:start;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
label{display:grid;gap:4px;align-content:start;font-size:14px;font-weight:700}
label small{font-weight:400;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.miss{border-color:var(--bad)!important;box-shadow:0 0 0 2px var(--badbg)}
textarea{min-height:84px;resize:vertical}
textarea.code{font:13px ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 13px;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--acc);background:var(--acc2)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
button.p:hover:not(:disabled){background:var(--acc);filter:brightness(1.12)}
button.sm{padding:4px 11px;font-size:14px}
button.aye{border-color:var(--ok);color:var(--ok)}button.no{border-color:var(--bad);color:var(--bad)}
button.aye.on{background:var(--ok);color:var(--card);font-weight:700}button.no.on{background:var(--bad);color:var(--card);font-weight:700}button.abstain.on{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:700}
button:disabled{opacity:.5;cursor:default}
.find{display:inline-flex;gap:8px;align-items:center;color:var(--mut);background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:99px;padding:3px 11px;font-size:13.5px;background:var(--card)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip small{opacity:.65}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.mut{color:var(--mut)}.small{font-size:13.5px}
.item{padding:10px 0;border-bottom:1px solid var(--soft);display:block;color:inherit;text-decoration:none}
.item:last-child{border-bottom:0}
a.item{margin:0 -8px;padding:10px 8px;border-radius:8px}
a.item:hover{background:var(--acc2)}
a.item .go{color:var(--acc);font-weight:700}
.item .t{font-weight:700}
.item .m{font-size:13.5px;color:var(--mut)}
.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 3px transparent}}
.tag{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-right:4px;white-space:nowrap}
.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.ok{background:var(--okbg);color:var(--ok)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;border:1px solid var(--line);vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:8px;padding:10px;min-width:0}
.stats b{display:block;font:400 18px/1.25 var(--serif);overflow-wrap:anywhere}
.stats span{font-size:12.5px;color:var(--mut)}
.meter{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--acc)}
.result{display:inline-block;border-radius:8px;padding:8px 12px;font-size:14px}
.result.ok{background:var(--okbg);color:var(--ok)}.result.bad{background:var(--badbg);color:var(--bad)}
.dobar{position:sticky;top:var(--hh);z-index:3;display:grid;gap:10px;box-shadow:0 6px 12px -10px var(--ink)}
.dobar h2{margin:0}
details.cmd{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card)}
details.cmd[open]{border-color:var(--acc)}
details.cmd>summary{cursor:pointer;padding:10px 14px;list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border-radius:10px}
details.cmd>summary:hover{background:var(--acc2)}
details.cmd>summary::-webkit-details-marker{display:none}
details.cmd>summary b{font-size:15px}
details.cmd>summary span{font-size:13.5px;color:var(--mut);grid-column:1}
details.cmd>summary .pin{grid-column:2;grid-row:1/3;border:0;background:none;font-size:18px;color:var(--line);padding:2px 6px}
details.cmd>summary .pin.on{color:var(--warn)}
details.cmd .body{padding:4px 14px 14px;display:grid;gap:10px}
details.raw summary{cursor:pointer;font-size:13px;color:var(--mut)}
h3.gh{margin:10px 4px 6px;font:400 16px var(--serif);color:var(--mut)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:360px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;margin:6px 0 0}
.checks{display:grid;gap:4px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--field)}
.checks label{display:flex;gap:8px;align-items:center;font-weight:400}
.checks input{width:auto}
.pickbox{display:grid;gap:4px;align-content:start;font-size:14px}.pickbox .lbl{font-weight:700}.pickbox small{font-size:12.5px}.ord{color:var(--acc)}
.clause{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.clause .head{display:flex;gap:8px;align-items:center}
.clause .head select{flex:1}
.gz{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:15px}
.gz .when{color:var(--mut);font-size:13px;white-space:nowrap;padding-top:2px}
.gz .day{grid-column:1/-1;font:400 15px var(--serif);color:var(--mut);border-bottom:1px solid var(--soft);margin-top:8px;padding-bottom:2px}
.empty{color:var(--mut);font-size:14.5px;padding:6px 0}
[hidden]{display:none!important}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:.2s;pointer-events:none;max-width:92vw;background:var(--ink);color:var(--bg);z-index:30;cursor:pointer}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}#toast.bad{background:var(--bad);color:#fff}
#pal{position:fixed;inset:0;z-index:20;background:rgba(27,36,48,.45);display:grid;justify-items:center;align-content:start;padding:12vh 12px 0}
.palbox{width:min(600px,100%);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px;display:grid;gap:8px;box-shadow:6px 6px 0 var(--ink)}
#pall{max-height:52vh;overflow:auto;display:grid;gap:2px}
#pall button{display:grid;text-align:left;border:0;background:none;padding:7px 10px;gap:0}
#pall button.on{background:var(--acc2)}
#pall button span{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){
  /* the tabs become a bottom bar, thumb-reachable; the header shrinks to one line */
  body{font-size:16px}
  main{padding:10px 10px calc(84px + env(safe-area-inset-bottom));gap:10px}
  header{padding-top:env(safe-area-inset-top)}
  .top{padding:8px 12px;gap:8px;flex-wrap:nowrap}
  .top h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .top .me{display:none}
  .find kbd,.find .lbl{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--ink);padding:0 4px env(safe-area-inset-bottom);gap:0}
  nav button{display:grid;justify-items:center;gap:1px;min-width:68px;min-height:56px;padding:6px 8px;font-size:12px;border-bottom:0;border-top:3px solid transparent}
  nav button.on{border-top-color:var(--acc)}
  nav button .ic{font-size:19px;line-height:1}
  nav .badge{position:absolute;margin:0 0 0 22px;font-size:10.5px}
  nav button{position:relative}
  .meline{display:flex!important}
  .dobar{position:static}
  .card{padding:14px;border-radius:12px}
  .grid,.fields{grid-template-columns:1fr}
  button{min-height:44px}
  button.sm{min-height:40px;padding:8px 13px}
  .row{gap:8px}
  .row>button{flex:1 1 auto}
  input,select,textarea{font-size:16px;min-height:44px}
  details.cmd>summary{padding:12px 14px}
  .gz{grid-template-columns:1fr;gap:2px}
  .gz .when{padding-top:8px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  #pal{padding-top:calc(4vh + env(safe-area-inset-top))}
  #pall{max-height:60vh}
}
.meline{display:none;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none;font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="realmName">Realm Console</h1>
    <button class="sm find" id="find" title="Find any action or page" aria-label="Find an action">🔍<span class="lbl"> Find an action…</span> <kbd>Ctrl K</kbd></button>
    <button class="sm" id="theme" title="Light, dark, or follow this PC"></button>
    <div class="me" id="meBar"><span class="live" id="live"></span><span>Not connected</span></div>
  </div>
  <div class="meline" id="meLine"></div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite" title="Click to dismiss"></div>
<div id="pal" hidden><div class="palbox" role="dialog" aria-label="Find an action">
  <input id="palq" type="search" placeholder="What do you want to do? Try: coalition, vote, send crowns…" autocomplete="off">
  <div id="pall"></div>
  <div class="small mut"><kbd>↑</kbd> <kbd>↓</kbd> to move · <kbd>Enter</kbd> to open · <kbd>Esc</kbd> to close</div>
</div></div>

<script>
'use strict';
/* ═════════════════════════════════════════════ basics */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get: k => { try { return localStorage.getItem('realm.' + k); } catch { return null; } },
  set: (k, v) => { try { v == null || v === '' ? localStorage.removeItem('realm.' + k) : localStorage.setItem('realm.' + k, v); } catch {} }
};
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad show' : 'show';
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), bad ? 8000 : 3200);
}
$('#toast').onclick = () => $('#toast').classList.remove('show');
/* camelCase / snake_case → "Camel case" */
const human = s => { const t = String(s).replace(/[._]/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase().trim(); return t.charAt(0).toUpperCase() + t.slice(1); };
const ago = ms => {
  if (!ms) return '';
  const d = (Date.now() - ms) / 1000;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  return new Date(ms).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
};
const left = (ms, now = SERVER_NOW()) => {
  if (!ms) return '';
  let s = Math.round((ms - now) / 1000);
  if (s <= 0) return 'closing';
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + 'd ' : '') + (d || h ? h + 'h ' : '') + (d ? '' : m + 'm') + ' left';
};
const until = ms => ms ? `<span data-until="${+ms}">${left(ms)}</span>` : '';

/* ═════════════════════════════════════════════ state */
let KEY = store.get('key') || '';
let BASE = store.get('base') || 'https://democracy-sim-1.onrender.com/api/v1';
let W = null, ME = null, VERSION = -1, CMDS = null, ALERTS = [], LOG = [];
let serverOffset = 0;
const SERVER_NOW = () => Date.now() + serverOffset;
const canAct = () => ME?.scope === 'act';

/* ═════════════════════════════════════════════ http
   Served by the local launcher → go through its proxy. Opened as a file → straight to the API (CORS is open). */
async function api(path, body, { quiet } = {}) {
  const viaProxy = location.protocol.startsWith('http') && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const headers = { Authorization: 'Bearer ' + KEY };
  if (body) headers['Content-Type'] = 'application/json';
  if (viaProxy) headers['X-Upstream'] = BASE;
  const t0 = performance.now();
  let status = 0, data;
  try {
    const r = await fetch((viaProxy ? '/proxy' : BASE) + path, { method: body ? 'POST' : 'GET', headers, body: body ? JSON.stringify(body) : undefined });
    status = r.status;
    const txt = await r.text();
    try { data = JSON.parse(txt); } catch { data = txt; }
  } catch (e) {
    data = { error: 'Could not reach the realm. The server may be waking up (about 30 seconds), or you are offline.' };
  }
  if (!quiet) { LOG.unshift({ path, body, status, ms: Math.round(performance.now() - t0), data, at: Date.now() }); if (LOG.length > 200) LOG.length = 200; }
  if (status < 200 || status >= 300) {
    const msg = (data && data.error) || ({ 401: 'That key was not accepted. It may be wrong or revoked.', 403: 'This key is read-only. Make an "act" key to do things.', 404: 'The realm does not know that route.', 429: 'Slow down: over 120 requests a minute.' })[status] || `Something went wrong (${status || 'no response'}).`;
    const err = new Error(msg); err.status = status; err.data = data; throw err;
  }
  return data;
}
function absorb(d) {
  if (d?.world) {
    W = d.world;
    if (d.serverNow) serverOffset = d.serverNow - Date.now();
    if (typeof d.version === 'number') VERSION = d.version;
  }
}
/* Do a thing in the game. Returns { ok, error }. Never throws. */
async function act(cmd, args) {
  try {
    const d = await api('/act', { cmd, args });
    noteTargets(args);
    if ((cmd === 'gov.edict' || cmd === 'regime.decree') && args?.kind === 'lift') store.set('lastLift', JSON.stringify({ what: args.what, day: Math.floor(SERVER_NOW() / 864e5) }));
    absorb(d); refreshAlerts(); render();
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
}

/* ═════════════════════════════════════════════ reading the world */
const coll = x => !x ? [] : Array.isArray(x) ? x.map((v, i) => [v?.id ?? String(i), v]) : Object.entries(x).map(([k, v]) => [v?.id ?? k, v]);
const who = id => id == null ? 'nobody' : (W?.citizens?.[id]?.name || id);
const partyName = id => W?.parties?.[id]?.name || (id ? id : 'Independent');
const hosTitle = () => W?.config?.hosTitle || (W?.config?.hos === 'monarchy' ? 'Monarch' : 'President');
const labelOf = (o, id) => {
  if (!o || typeof o !== 'object') return String(o ?? id);
  const main = o.name || o.title || o.headline || o.q || o.question || o.text || o.label;
  const extra = o.stage || o.status || o.kind || '';
  return (main ? String(main).slice(0, 80) : `#${id}`) + (extra && main ? ` · ${extra}` : '');
};
const STAGE = {
  debate: ['In debate', 'warn'], vote: ['Voting now', 'bad'], passed: ['Passed', 'ok'], assent: ['Awaiting assent', 'warn'],
  enacted: ['Law', 'ok'], failed: ['Failed', ''], vetoed: ['Vetoed', 'bad'], withheld: ['Assent withheld', 'bad'],
  override: ['Override vote', 'warn'], hos: ['With the head of state', 'warn'], consent: ['Needs PM consent', 'warn'], commanded: ['Enacted by Royal Command', 'ok'], struck: ['Struck by Royal Command', 'bad'], refused: ['Consent refused', 'bad']
};
const stageTag = s => { const [t, c] = STAGE[s] || [human(s || '?'), '']; return `<span class="tag ${c}">${esc(t)}</span>`; };

/* Where to find the things an "id" argument can mean. */
const recentTargets = () => { try { return JSON.parse(store.get('targets') || '[]'); } catch { return []; } };
function noteTargets(args) {
  const ids = Object.entries(args || {}).filter(([k, v]) => typeof v === 'string' && ['target', 'citizen', 'heir', 'who', 'to', 'candidate'].includes(k) && W?.citizens?.[v]).map(([, v]) => v);
  if (ids.length) store.set('targets', JSON.stringify([...new Set([...ids, ...recentTargets()])].slice(0, 6)));
}
const SOURCES = {
  citizen: () => { const rec = recentTargets(); return coll(W?.citizens).filter(([, c]) => c?.active !== false).sort((a, b) => ((rec.indexOf(a[0]) + 1 || 99) - (rec.indexOf(b[0]) + 1 || 99))).map(([id, c]) => [id, (rec.includes(id) ? '↺ ' : '') + c.name + (c.party ? ' · ' + partyName(c.party) : '')]); },
  prop: () => coll(W?.proposals).sort((a, b) => (b[1].n || 0) - (a[1].n || 0)).map(([id, p]) => [id, `${p.n ? '#' + p.n + ' ' : ''}${p.title} · ${STAGE[p.stage]?.[0] || p.stage}`]),
  election: () => coll(W?.elections).filter(([, e]) => e.status !== 'closed').map(([id, e]) => [id, `${e.title || human(e.kind || 'Election')} · ${e.status}`]),
  party: () => coll(W?.parties).map(([id, p]) => [id, `${p.name}${p.status && p.status !== 'active' ? ' · ' + p.status : ''}`]),

function parseArg(name, type) {

  if (name === 'candidate' && /single vote/.test(t)) return { name, kind: 'pick', src: 'standing', type: t, optional: true };
  if (/^bool/.test(t)) return { name, kind: 'bool', type: t, optional };
  if (/clause object|list of clause|^list \(optional\)$/.test(t) || (name === 'clauses')) return { name, kind: 'clauses', type: t, optional };
  if (/^list of text/.test(t)) return { name, kind: 'lines', type: t, optional };
  if (/^list|ids/.test(t)) return { name, kind: 'multi', src: /option index/.test(t) ? 'optindex' : (sourceFor(name, t) || (/side/.test(t) ? 'side' : /citizen|candidate/.test(t) ? 'citizen' : null)), type: t, optional };

  if (/^number/.test(t)) return { name, kind: /index/.test(t) ? 'index' : 'num', type: t, optional };
  if (/^id/.test(t)) { const src = sourceFor(name, t); return { name, kind: src ? 'pick' : 'text', src, type: t, optional, nullable: /or null/.test(t) }; }

}

function readArgs(form) {
  const out = {};
  form.querySelectorAll('[data-arg]').forEach(el => {
    if (el.closest('[hidden]')) return;
    const k = el.dataset.arg, kind = el.dataset.kind;
    if (kind === 'clauses') { const c = readClauses(el); if (c.length) out[k] = c; return; }
    if (kind === 'multi') {
      const v = el.matches('[data-csv]') ? el.value.split(',').map(s => s.trim()).filter(Boolean) : [...el.querySelectorAll('input:checked')].sort((x, y) => (+x.dataset.o || 0) - (+y.dataset.o || 0)).map(i => i.value);
      if (v.length) out[k] = v.map(x => /^\d+$/.test(x) && /index/.test(k + kind) ? +x : x); return;
    }
    const v = el.value;
    if (v === '' || v == null) { if (el.closest('label')?.textContent.includes('Nobody') && kind === 'pick') out[k] = null; return; }
    if (kind === 'lines') out[k] = v.split('\n').map(s => s.trim()).filter(Boolean);

    else if (kind === 'bool') out[k] = v === 'true';
    else out[k] = v;
  });

}

  if (e.target.matches('[data-del]')) e.target.closest('[data-clause]').remove();

function readClauses(root) {
  return [...root.querySelectorAll('[data-clause]')].map(cl => {
    const o = { t: cl.querySelector('[data-type]').value };

    return o;
  });
}

/* The address is the page: #house, #house/<proposal id>, #do/<action>. Back and forward work. */
function go(v, sub) { const h = '#' + v + (sub ? '/' + sub : ''); if (location.hash === h) route(); else location.hash = h; }
function route() {
  const [v, ...rest] = location.hash.slice(1).split('/'), sub = decodeURIComponent(rest.join('/'));

function wireConnect() {

  $('#cf').onsubmit = async e => {
    e.preventDefault();
    const k = $('#ck').value.trim();
    if (!/^rlm_/.test(k)) { $('#cmsg').innerHTML = '<span style="color:var(--bad)">Keys start with rlm_. Check you copied the whole thing.</span>'; $('#ck').classList.add('miss'); $('#ck').focus(); return; }
    KEY = k; BASE = ($('#cb')?.value.trim() || BASE).replace(/\/+$/, '');
    store.set('base', BASE); store.set('key', $('#cr').checked ? KEY : null);
    $('#cgo').disabled = true; $('#cmsg').textContent = 'Connecting… the server may need ~30 seconds to wake up.';
    try { await connect(); } catch (err) { $('#cmsg').innerHTML = `<span style="color:var(--bad)">${esc(err.message)}</span>`; }
    $('#cgo') && ($('#cgo').disabled = false);
  };
}
async function connect() {
  ME = await api('/me');
  absorb(await api('/state'));
  CMDS = await api('/commands').catch(() => ({}));
  await refreshAlerts();

async function refreshAlerts() { try { ALERTS = await api('/alerts', null, { quiet: true }); } catch { ALERTS = []; } notifyNew(); }
/* Desktop notifications for anything new that needs you (crises, signatures, assent, votes). Off until you turn them on in Settings. */
const notifyOn = () => store.get('notify') === 'on' && 'Notification' in window && Notification.permission === 'granted';
function notifyNew() {
  if (!Array.isArray(ALERTS)) return;
  let seen; try { seen = new Set(JSON.parse(store.get('seenAlerts') || '[]')); } catch { seen = new Set(); }
  const fresh = ALERTS.filter(a => a.key && !seen.has(a.key));
  if (notifyOn()) fresh.slice(0, 3).forEach(a => { try { const n = new Notification(a.label || 'The Realm', { body: a.title, tag: a.key }); n.onclick = () => { window.focus(); const h = alertHash(a.href); if (h) location.hash = h; }; } catch {} });
  store.set('seenAlerts', JSON.stringify([...new Set([...ALERTS.map(a => a.key), ...seen])].slice(0, 300)));
}

function describeClause(c) {
  switch (c.t) {
    case 'text': return c.text;
    case 'set': return `Sets ${(SETTABLE[c.key]?.[0] || c.key).toLowerCase()} to ${c.value}${SETTABLE[c.key]?.[1] || ''}${typeof c.from === 'number' ? ` (was ${c.from})` : ''}.`;
    case 'constitution': { const k = CONST_KEYS[c.key]; const v = (k?.[1] || []).find(x => (Array.isArray(x) ? x[0] : x) == c.value); return `Constitution: ${(k?.[0] || c.key).toLowerCase()} becomes ${c.label || (Array.isArray(v) ? v[1] : c.value)}.`; }
    case 'office': return c.template ? `Creates the ${OFFICE_TEMPLATES[c.template] || c.template}.` : `Creates the office of ${c.office?.name}.`;
    case 'abolish': return `Abolishes the ${W.offices?.[c.office]?.name || 'office'}.`;
    case 'budget': return `Sets the ${W.offices?.[c.office]?.name || 'office'} budget to ${c.value} crowns a week.`;
    case 'repeal': return `Repeals ${c.ref}.`;
    case 'removeHos': return `Removes the ${hosTitle()}.`;
    case 'war': return `Declares war on ${W.nations?.[c.nation]?.name || c.nation}.`;
    case 'peace': return `Makes peace with ${W.nations?.[c.nation]?.name || c.nation}.`;
    case 'job': return `Creates a civic job: ${c.title} (${c.pay} crowns).`;
    case 'zone': return `Adds a Streets safe zone: ${c.text}.`;
    case 'currency': return `Renames the currency: the crown becomes the ${c.one}${c.many ? ` (${c.many})` : ''}.`;
    default: return ACTS[c.t] ? 'Enacts the ' + ACTS[c.t] : CLAUSE_TYPES[c.t] || c.t;
  }
}

/* What a decree will do, in a sentence, with what it costs of today's allowance. */
function decreeBudget() {
  const per = Math.max(1, Number(W?.config?.edictsPerDay) || 1);
  const used = W?.regime?.decreeDay === Math.floor(SERVER_NOW() / 864e5) ? (W.regime.decreeCount || 1) : 0;
  return { per, used, left: Math.max(0, per - used) };
}
function plainDecree(cmd, a) {

  if (cmd === 'jail.release') return `Release ${who(a.target)} from the Realm Jail?`;
  if (cmd !== 'gov.edict' && cmd !== 'regime.decree') return '';
  const k = CMDS?.[cmd]?.kinds?.[a.kind]; if (!k) return '';
  const subj = a.target ? ` ${who(a.target)}` : a.party ? ` the ${partyName(a.party)}` : a.bank ? ` ${W.banks?.[a.bank]?.name || 'the bank'}` : '';
  const extra = a.kind === 'arrest' ? ` for ${a.n || 2} day${(a.n || 2) === 1 ? '' : 's'}` : a.kind === 'lift' && a.what ? `: ${human(a.what).toLowerCase()}` : a.n != null ? ` (${a.n})` : '';
  const b = decreeBudget();
  return `${k.name}${subj}${extra}? This uses 1 of today’s ${b.per} decree${b.per === 1 ? '' : 's'} (${b.left} left).`;
}

        form.querySelector('[data-kwhat]').textContent = k ? k.what + (k.needs.length ? '' : ' Needs nothing else.') : 'Choose what to decree.';
        /* the same field means different things to different decrees */
        const NAMES = { n: { arrest: 'Days (1–2)', tax: 'Income tax (%)', rate: 'Reserve rate (%)', plan: 'Crowns' }, text: { honour: 'Title to give' }, target: { seize: 'Whose funds', heir: 'Heir' }, key: { rewrite: 'Which rule' }, value: { rewrite: 'New value' }, what: { lift: 'Which decree to lift' } };
        form.querySelectorAll('[data-arg]').forEach(el => {
          if (el.dataset.arg === 'kind') return;
          const box = el.closest('label, .pickbox') || el; box.hidden = !needs().includes(el.dataset.arg);
          const l = box.querySelector('[data-lbl]'); if (l) l.textContent = NAMES[el.dataset.arg]?.[kindSel.value] || human(el.dataset.arg);
          box.querySelectorAll(':scope > small').forEach(sm => { sm.hidden = true; });
        });
      };
      kindSel.addEventListener('change', shape); shape();
    }
    const pv = () => { body.querySelector('[data-pv]').textContent = JSON.stringify({ cmd, args: readArgs(form) }, null, 2); };
    const calm = () => { delete btn.dataset.armed; delete btn.dataset.miss; btn.textContent = 'Do it'; form.querySelectorAll('.miss').forEach(el => el.classList.remove('miss')); };
    form.addEventListener('input', () => { pv(); calm(); }); form.addEventListener('change', () => { pv(); calm(); }); pv();
    form.addEventListener('submit', e => { e.preventDefault(); btn.click(); });
    btn.onclick = async () => {
      const a = readArgs(form);
      /* Empty fields the action probably needs: point at them once, then let a second press through. */
      const missing = kinds ? [{ name: 'kind' }, ...needs().map(name => ({ name }))].filter(x => a[x.name] === undefined) : args.filter(x => !x.optional && !x.nullable && x.kind !== 'bool' && a[x.name] === undefined && !form.querySelector(`[data-arg="${CSS.escape(x.name)}"]`)?.closest('[hidden]'));
      if (missing.length && !btn.dataset.miss) {
        btn.dataset.miss = 1; btn.textContent = 'Send anyway';
        missing.forEach(x => form.querySelector(`[data-arg="${CSS.escape(x.name)}"]`)?.classList.add('miss'));
        return show(res, false, `Still empty: ${missing.map(x => human(x.name).toLowerCase()).join(', ')}.`);
      }
      const sentence = plainDecree(cmd, a);
      if (sentence && !confirm(sentence)) return;
      if (DANGER.test(cmd) && !btn.dataset.armed && !sentence) {
        btn.dataset.armed = 1; btn.textContent = 'Sure? Press again'; setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = 'Do it'; } }, 3500); return;
      }
      btn.disabled = true; btn.textContent = 'Working…';
      const before = W.gazette?.[0]?.id;
      const r = await act(cmd, a);
      btn.disabled = false; calm();
      const news = W.gazette?.[0];
      show(res, r.ok, r.ok ? 'Done.' + (news && news.id !== before ? ' ' + news.text : '') : r.error);
      if (r.ok) { noteRecent(cmd); $('#dquick') && ($('#dquick').innerHTML = quickHtml()); }
    };
  }));
}

/* ---------------------------------------------------------------- gazette */
function viewGazette() {
  const kinds = [...new Set((W.gazette || []).map(x => x.kind).filter(Boolean))].sort();
  return `<div class="card"><div class="row between"><h2>The Gazette <span class="sub">the public record, live</span></h2><button id="gcopy" class="sm">Copy the digest for WhatsApp</button></div>
    <input id="gq" type="search" placeholder="Search the record: a name, a bill, a party…" value="${esc(GQ)}" style="margin-bottom:8px">
    <div class="chips" id="gkinds" style="margin-bottom:10px"><button class="chip ${GKIND ? '' : 'on'}" data-gk="">Everything</button>${kinds.map(k => `<button class="chip ${k === GKIND ? 'on' : ''}" data-gk="${esc(k)}">${esc(human(k))}</button>`).join('')}</div>
    <div id="glist">${gazetteList(300, true)}</div></div>`;
}
function wireGazette() {
  $('#gq').oninput = () => { GQ = $('#gq').value; $('#glist').innerHTML = gazetteList(300, true); };
  $('#gkinds').onclick = e => { const b = e.target.closest('[data-gk]'); if (!b) return; GKIND = b.dataset.gk; render(true); };
}
document.addEventListener('click', async e => {
  if (e.target.id !== 'gcopy') return;
  try {
    const base = BASE.replace(/\/api\/v1$/, '');
    const viaProxy = location.protocol.startsWith('http') && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    const r = await fetch(viaProxy ? '/proxy/api/public/digest.txt' : base + '/api/public/digest.txt', { headers: viaProxy ? { 'X-Upstream': base } : {} });
    await navigator.clipboard.writeText(await r.text()); toast('Copied. Paste it into the group.');
  } catch { toast('Could not copy the digest.', true); }
});

/* ---------------------------------------------------------------- settings */
function viewSettings() {
  return `<div class="grid">
    <div class="card"><h2>Desktop notifications</h2>
      <p class="small">A notification when something new needs you: a crisis you are caught up in, a signature the Treasury needs, a bill awaiting your assent, a vote closing. Only while this console is open.</p>
      <div class="row"><button id="notif">${notifyOn() ? 'Turn notifications off' : 'Turn notifications on'}</button><span class="small mut">${!('Notification' in window) ? 'This browser has no notifications.' : Notification.permission === 'denied' ? 'Blocked in the browser’s site settings.' : ''}</span></div></div>
    <div class="card"><h2>Your key</h2>
      <p class="small">Connected as <b>${esc(ME.name)}</b> with key “${esc(ME.keyName || 'unnamed')}” (${canAct() ? 'can act' : 'read only'}).</p>
      <div class="row"><button id="sout">Disconnect and forget the key</button></div></div>
    <div class="card"><h2>Webhooks <span class="sub">have the realm message you</span></h2><div id="hooks" class="small mut">Loading…</div>
      ${canAct() ? `<div class="fields" style="margin-top:10px"><label>Address (https)<input id="hurl" placeholder="https://…"></label><label>Send<select id="hkind"><option value="gazette">All public news</option><option value="personal">My own alerts (private)</option></select></label></div><div class="row" style="margin-top:8px"><button id="hadd">Add webhook</button><span id="hres"></span></div>` : ''}</div>
  </div>
  <div class="card"><h2>Advanced: send anything</h2>
    <div class="fields"><label>Action<input id="rcmd" list="rcmds" placeholder="prop.vote"><datalist id="rcmds">${Object.keys(CMDS || {}).map(c => `<option value="${esc(c)}">`).join('')}</datalist></label></div>
    <label style="margin-top:8px">Arguments (JSON)<textarea class="code" id="rargs">{}</textarea></label>
    <div class="row" style="margin-top:8px"><button id="rgo">Send</button><span id="rres"></span></div></div>
  <div class="card"><h2>Request log</h2>${LOG.slice(0, 40).map(l => `<details class="raw item"><summary><span class="tag ${l.status >= 200 && l.status < 300 ? 'ok' : 'bad'}">${l.status || '—'}</span> ${esc(l.body?.cmd || 'GET ' + l.path)} <span class="mut">${ago(l.at)} · ${l.ms}ms</span></summary>${l.body ? `<pre>${esc(JSON.stringify(l.body, null, 2))}</pre>` : ''}<pre>${esc(typeof l.data === 'string' ? l.data : JSON.stringify(l.data?.world ? { ...l.data, world: '…' } : l.data, null, 2))}</pre></details>`).join('') || '<div class="empty">Nothing yet.</div>'}</div>`;
}
async function loadHooks() {
  try {
    const h = await api('/hooks', null, { quiet: true });
    $('#hooks').innerHTML = (Array.isArray(h) ? h : h.hooks || []).map(x => `<div class="item"><span class="t">${esc(x.url)}</span> <span class="tag">${esc(x.kind)}</span>${x.disabled ? '<span class="tag bad">switched off</span>' : ''}
      ${canAct() ? `<div class="row" style="margin-top:6px"><button class="sm" data-htest="${esc(x.id)}">Send a test</button><button class="sm no" data-hdel="${esc(x.id)}">Remove</button></div>` : ''}</div>`).join('') || 'None yet.';
  } catch (e) { $('#hooks').textContent = e.message; }
}
function wireSettings() {
  const nb = $('#notif');
  if (nb) nb.onclick = async () => {
    if (notifyOn()) store.set('notify', 'off');
    else if ('Notification' in window && (await Notification.requestPermission()) === 'granted') { store.set('notify', 'on'); new Notification('The Realm', { body: 'Notifications are on.' }); }
    render(true);
  };
  $('#sout').onclick = () => { store.set('key', null); KEY = ''; W = null; ME = null; LOOPING = false; CONN = 'off'; render(true); };
  loadHooks();
  $('#hadd') && ($('#hadd').onclick = async () => {
    try { const r = await api('/hooks', { url: $('#hurl').value.trim(), kind: $('#hkind').value }); show($('#hres'), true, `Added. Secret (shown once): ${r.secret}`); loadHooks(); }
    catch (e) { show($('#hres'), false, e.message); }
  });
  $('#hooks').onclick = async e => {
    const t = e.target.dataset.htest, d = e.target.dataset.hdel;
    try {
      if (t) { const r = await api('/hooks/test', { id: t }); toast(r.ok ? 'Test delivered.' : `Your server answered ${r.status}.`, !r.ok); }
      if (d) { await api('/hooks/delete', { id: d }); toast('Removed.'); loadHooks(); }
    } catch (err) { toast(err.message, true); }
  };
  $('#rcmd').onchange = () => {
    const info = CMDS?.[$('#rcmd').value.trim()], box = $('#rargs');
    if (info && /^\s*(\{\s*\})?\s*$/.test(box.value)) box.value = JSON.stringify(Object.fromEntries(Object.keys(info.args || {}).map(k => [k, ''])), null, 2);
  };
  $('#rgo').onclick = async () => {
    let a; try { a = JSON.parse($('#rargs').value || '{}'); } catch (e) { return show($('#rres'), false, 'Arguments are not valid JSON.'); }
    const r = await act($('#rcmd').value.trim(), a); show($('#rres'), r.ok, r.ok ? 'Done.' : r.error);
  };
}

/* ═════════════════════════════════════════════ quick buttons anywhere */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-do]');
  if (b) {
    b.disabled = true;
    const r = await act(b.dataset.do, JSON.parse(b.dataset.a));
    b.disabled = false;
    toast(r.ok ? 'Done.' : r.error, !r.ok);
    return;
  }
  const s = e.target.closest('[data-speak]');
  if (s) {
    const item = s.closest('.item');
    if (item.querySelector('.speak')) return;
    item.insertAdjacentHTML('beforeend', `<div class="speak" style="display:grid;gap:8px;margin-top:8px"><select><option value="for">Speaking for</option><option value="against">Speaking against</option><option value="undecided">Undecided</option>${W.speaker === W.viewer ? '<option value="order">Order (as Speaker)</option>' : ''}</select><textarea placeholder="Your speech"></textarea><div class="row"><button class="p sm">Speak</button><button class="sm" data-cancel>Cancel</button></div></div>`);
    const box = item.querySelector('.speak');
    box.querySelector('[data-cancel]').onclick = () => box.remove();
    box.querySelector('.p').onclick = async () => {
      const r = await act('prop.speak', { prop: s.dataset.speak, side: box.querySelector('select').value, text: box.querySelector('textarea').value });
      toast(r.ok ? 'Your speech is in the record.' : r.error, !r.ok);
    };
  }
});

/* ═════════════════════════════════════════════ find anything (Ctrl K) */
let PALI = 0, PALROWS = [];
function palDraw() {
  const ws = $('#palq').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const pages = Object.entries(VIEWS).map(([v, l]) => ({ t: l, s: 'Page', h: [v], k: ('page ' + l).toLowerCase() }));
  const cmds = Object.entries(CMDS || {}).map(([c, i]) => ({ t: cmdTitle(c), s: i.about, h: ['do', c], k: searchKey(c, i), c }));
  const fav = [...new Set([...listOf('pins'), ...listOf('recent')])];
  /* Best first: words found in the action's own name beat words found only in its description or group. */
  const score = x => { const own = ((x.c || '') + ' ' + x.t).toLowerCase(); return ws.filter(w => own.includes(w)).length; };
  PALROWS = ws.length ? [...cmds, ...pages].filter(x => ws.every(w => x.k.includes(w))).sort((a, b) => score(b) - score(a)).slice(0, 14) : [...fav.map(c => cmds.find(x => x.c === c)).filter(Boolean), ...pages];
  PALI = Math.max(0, Math.min(PALI, PALROWS.length - 1));
  $('#pall').innerHTML = PALROWS.map((x, i) => `<button data-i="${i}" class="${i === PALI ? 'on' : ''}"><b>${esc(x.t)}</b><span>${esc(x.s)}</span></button>`).join('') || '<div class="empty" style="padding:8px 10px">Nothing matches. Try another word.</div>';
  $('#pall .on')?.scrollIntoView({ block: 'nearest' });
}
function palOpen() { if (!W) return; $('#pal').hidden = false; $('#palq').value = ''; PALI = 0; palDraw(); $('#palq').focus(); }
function palClose() { $('#pal').hidden = true; }
function palGo(i) { const x = PALROWS[i]; if (!x) return; palClose(); go(...x.h); }
$('#find').onclick = palOpen;
$('#palq').oninput = () => { PALI = 0; palDraw(); };
$('#palq').onkeydown = e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); PALI = (PALI + (e.key === 'ArrowDown' ? 1 : -1) + PALROWS.length) % (PALROWS.length || 1); palDraw(); }
  if (e.key === 'Enter') { e.preventDefault(); palGo(PALI); }
};
$('#pal').onclick = e => { const b = e.target.closest('[data-i]'); if (b) palGo(+b.dataset.i); else if (e.target.id === 'pal') palClose(); };
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); $('#pal').hidden ? palOpen() : palClose(); }
  else if (e.key === 'Escape' && !$('#pal').hidden) palClose();
});
/* Buttons that jump to an action's form, and the ★ on each action. */
document.addEventListener('click', e => {
  const pin = e.target.closest('[data-pin]');
  if (pin) { e.preventDefault(); togglePin(pin.dataset.pin); pin.classList.toggle('on'); $('#dquick') && ($('#dquick').innerHTML = quickHtml()); return; }
  const o = e.target.closest('[data-open]');
  if (!o) return;
  if (VIEW === 'do' && $('#dq')) { try { history.replaceState(null, '', '#do/' + o.dataset.open); } catch {} openAction(o.dataset.open); }
  else go('do', o.dataset.open);
});

/* ═════════════════════════════════════════════ live updates (long-poll) */
let LOOPING = false, CONN = 'off';
async function loop() {
  if (LOOPING) return; LOOPING = true; CONN = 'live'; header();
  while (LOOPING && KEY) {
    try {
      const d = await api(`/state?since=${VERSION}&wait=25`, null, { quiet: true });
      if (CONN !== 'live') { CONN = 'live'; header(); }
      if (d?.version !== undefined && d.version !== VERSION) { absorb(d); await refreshAlerts(); render(); }
    } catch (e) {
      if (e.status === 401) { LOOPING = false; toast('Your key stopped working. Connect again with a new one.', true); break; }
      if (CONN !== 'retry') { CONN = 'retry'; header(); }
      await new Promise(r => setTimeout(r, 5000));
    }
  }
  LOOPING = false; CONN = 'off'; header();
}
/* Countdowns tick on their own; nothing is redrawn. */
setInterval(() => document.querySelectorAll('[data-until]').forEach(el => { el.textContent = left(+el.dataset.until); }), 30000);

/* ═════════════════════════════════════════════ start */
render(true);
if (KEY) {
  $('#cmsg').textContent = 'Connecting… the server may need about 30 seconds to wake up.'; $('#cgo').disabled = true;
  connect().catch(e => { render(true); $('#cmsg') && ($('#cmsg').innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`); });
}
</script>
