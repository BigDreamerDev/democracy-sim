# Render's free tier sleeps after 15 idle minutes. This pings the API every 10 minutes from 06:00 to 00:59 UTC
# so players rarely meet a cold start. The game clock is safe either way: deadlines are caught up on wake.
name: keep awake
on:
  schedule:
    - cron: '*/10 0,6-23 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: docs/config.js, sparse-checkout-cone-mode: false }
      - run: |
          API=$(grep -o 'https://[^"]*' docs/config.js | head -1)
          curl -fsS --max-time 90 "$API/api/health" || curl -fsS --max-time 90 "$API/api/health"
