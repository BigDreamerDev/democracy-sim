services:
  - type: web
    name: republic-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    buildFilter:
      paths: ["server/**", "engine/**"]   # the server imports ../engine, so engine changes must redeploy too
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        sync: false   # keep the v1 value so old sessions stay valid
      - key: DATABASE_URL
        sync: false   # the Neon connection string
      - key: ALLOWED_ORIGINS
        value: https://bigdreamerdev.github.io
