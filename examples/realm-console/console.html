<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFCF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18232A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Console">
<link rel="manifest" href="console.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Realm Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gloock&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0E8;--card:#FBFCF8;--field:#fff;--ink:#1B2430;--mut:#4A5560;--line:#C3CFC0;--soft:#E1E6DC;--acc:#1F5E57;--acc2:#E4ECE8;--onacc:#FBFCF8;--ok:#1F6B45;--okbg:#E1EFE4;--bad:#A8321F;--badbg:#F3E3DF;--warn:#8A4B14;--warnbg:#F3E8D6;--hh:92px;
  --serif:'Gloock','Iowan Old Style','Palatino Linotype',Georgia,serif;--sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11191E;--card:#18232A;--field:#121B21;--ink:#E3E8DE;--mut:#A7B2AC;--line:#33443F;--soft:#22302E;--acc:#74BCAC;--acc2:#1B2F2B;--onacc:#0E1518;--ok:#7CCB9A;--okbg:#17302A;--bad:#E7836E;--badbg:#35211D;--warn:#E39A60;--warnbg:#2B261D}}
:root[data-empire]{--bg:#F1ECDF;--card:#FCF9F0;--line:#D3C49E;--soft:#E7DFCC;--acc:#5E1B3C;--acc2:#F1E3E7;--onacc:#F6EBDC}
:root[data-empire] .card{box-shadow:3px 3px 0 #C9A13B}
@media(prefers-color-scheme:dark){:root[data-empire]:not([data-theme=light]){--bg:#140E11;--card:#1D1418;--field:#170F13;--ink:#EDE3D2;--mut:#B9AA94;--line:#4E3A2A;--soft:#2C1E24;--acc:#D9A7BC;--acc2:#33202A;--onacc:#140E11}}
:root[data-empire][data-theme=dark]{--bg:#140E11;--card:#1D1418;--field:#170F13;--ink:#EDE3D2;--mut:#B9AA94;--line:#4E3A2A;--soft:#2C1E24;--acc:#D9A7BC;--acc2:#33202A;--onacc:#140E11}
.gz .moment{border-left:3px solid #C9A13B;padding-left:6px}.gz .fx{color:#C9A13B}
:root[data-theme=dark]{--bg:#11191E;--card:#18232A;--field:#121B21;--ink:#E3E8DE;--mut:#A7B2AC;--line:#33443F;--soft:#22302E;--acc:#74BCAC;--acc2:#1B2F2B;--onacc:#0E1518;--ok:#7CCB9A;--okbg:#17302A;--bad:#E7836E;--badbg:#35211D;--warn:#E39A60;--warnbg:#2B261D}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hh) + 12px)}
body{margin:0;font:16px/1.5 var(--sans);background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--ink)}
.top{display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.top h1{font:400 22px/1.1 var(--serif);margin:0 6px 0 0}
.top .me{margin-left:auto;font-size:13.5px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--ink);white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.live{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}.live.on{background:var(--ok);box-shadow:0 0 0 3px var(--okbg)}.live.wait{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
kbd{font:12px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card);color:var(--mut)}
code{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;border-radius:0;color:var(--mut);font-weight:700;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
nav .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11.5px;padding:0 6px;margin-left:5px}
main{max-width:1080px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font:400 19px/1.2 var(--serif);margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 .sub{font:400 13.5px var(--sans);color:var(--mut)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.fields{display:grid;gap:10px;align-items:start;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
label{display:grid;gap:4px;align-content:start;font-size:14px;font-weight:700}
label small{font-weight:400;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.miss{border-color:var(--bad)!important;box-shadow:0 0 0 2px var(--badbg)}
textarea{min-height:84px;resize:vertical}
textarea.code{font:13px ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 13px;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--acc);background:var(--acc2)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
button.p:hover:not(:disabled){background:var(--acc);filter:brightness(1.12)}
button.sm{padding:4px 11px;font-size:14px}
button.aye{border-color:var(--ok);color:var(--ok)}button.no{border-color:var(--bad);color:var(--bad)}
button.aye.on{background:var(--ok);color:var(--card);font-weight:700}button.no.on{background:var(--bad);color:var(--card);font-weight:700}button.abstain.on{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:700}
button:disabled{opacity:.5;cursor:default}
.find{display:inline-flex;gap:8px;align-items:center;color:var(--mut);background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:99px;padding:3px 11px;font-size:13.5px;background:var(--card)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip small{opacity:.65}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.mut{color:var(--mut)}.small{font-size:13.5px}
.item{padding:10px 0;border-bottom:1px solid var(--soft);display:block;color:inherit;text-decoration:none}
.item:last-child{border-bottom:0}
a.item{margin:0 -8px;padding:10px 8px;border-radius:8px}
a.item:hover{background:var(--acc2)}
a.item .go{color:var(--acc);font-weight:700}
.item .t{font-weight:700}
.item .m{font-size:13.5px;color:var(--mut)}
.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 3px transparent}}
.bill{display:grid;gap:3px;line-height:1.5}.bill .b-title{font-family:var(--serif);letter-spacing:.1em;text-transform:uppercase;text-align:center}.bill .b-head{font-family:var(--serif);font-size:1.1em;margin-top:4px}.bill .b-pre{font-style:italic;color:var(--mut)}.bill .b-row{display:flex;gap:8px}.bill .b-mark{flex:none;min-width:22px;color:var(--mut)}
.tag{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-right:4px;white-space:nowrap}
.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.ok{background:var(--okbg);color:var(--ok)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;border:1px solid var(--line);vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:8px;padding:10px;min-width:0}
.stats b{display:block;font:400 18px/1.25 var(--serif);overflow-wrap:anywhere}
.stats span{font-size:12.5px;color:var(--mut)}
.meter{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--acc)}
.result{display:inline-block;border-radius:8px;padding:8px 12px;font-size:14px}
.result.ok{background:var(--okbg);color:var(--ok)}.result.bad{background:var(--badbg);color:var(--bad)}
.dobar{position:sticky;top:var(--hh);z-index:3;display:grid;gap:10px;box-shadow:0 6px 12px -10px var(--ink)}
.dobar h2{margin:0}
details.cmd{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card)}
details.cmd[open]{border-color:var(--acc)}
details.cmd>summary{cursor:pointer;padding:10px 14px;list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border-radius:10px}
details.cmd>summary:hover{background:var(--acc2)}
details.cmd>summary::-webkit-details-marker{display:none}
details.cmd>summary b{font-size:15px}
details.cmd>summary span{font-size:13.5px;color:var(--mut);grid-column:1}
details.cmd>summary .pin{grid-column:2;grid-row:1/3;border:0;background:none;font-size:18px;color:var(--line);padding:2px 6px}
details.cmd>summary .pin.on{color:var(--warn)}
details.cmd .body{padding:4px 14px 14px;display:grid;gap:10px}
details.raw summary{cursor:pointer;font-size:13px;color:var(--mut)}
h3.gh{margin:10px 4px 6px;font:400 16px var(--serif);color:var(--mut)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:360px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;margin:6px 0 0}
.checks{display:grid;gap:4px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--field)}
.checks label{display:flex;gap:8px;align-items:center;font-weight:400}
.checks input{width:auto}
.pickbox{display:grid;gap:4px;align-content:start;font-size:14px}.pickbox .lbl{font-weight:700}.pickbox small{font-size:12.5px}.ord{color:var(--acc)}
.clause{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.clause .head{display:flex;gap:8px;align-items:center}
.clause .head select{flex:1}
.gz{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:15px}
.gz .when{color:var(--mut);font-size:13px;white-space:nowrap;padding-top:2px}
.gz .day{grid-column:1/-1;font:400 15px var(--serif);color:var(--mut);border-bottom:1px solid var(--soft);margin-top:8px;padding-bottom:2px}
.empty{color:var(--mut);font-size:14.5px;padding:6px 0}
[hidden]{display:none!important}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:.2s;pointer-events:none;max-width:92vw;background:var(--ink);color:var(--bg);z-index:30;cursor:pointer}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}#toast.bad{background:var(--bad);color:#fff}
#pal{position:fixed;inset:0;z-index:20;background:rgba(27,36,48,.45);display:grid;justify-items:center;align-content:start;padding:12vh 12px 0}
.palbox{width:min(600px,100%);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px;display:grid;gap:8px;box-shadow:6px 6px 0 var(--ink)}
#pall{max-height:52vh;overflow:auto;display:grid;gap:2px}
#pall button{display:grid;text-align:left;border:0;background:none;padding:7px 10px;gap:0}
#pall button.on{background:var(--acc2)}
#pall button span{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){
  /* the tabs become a bottom bar, thumb-reachable; the header shrinks to one line */
  body{font-size:16px}
  main{padding:10px 10px calc(84px + env(safe-area-inset-bottom));gap:10px}
  header{padding-top:env(safe-area-inset-top)}
  .top{padding:8px 12px;gap:8px;flex-wrap:nowrap}
  .top h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .top .me{display:none}
  .find kbd,.find .lbl{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--ink);padding:0 4px env(safe-area-inset-bottom);gap:0}
  nav button{display:grid;justify-items:center;gap:1px;min-width:68px;min-height:56px;padding:6px 8px;font-size:12px;border-bottom:0;border-top:3px solid transparent}
  nav button.on{border-top-color:var(--acc)}
  nav button .ic{font-size:19px;line-height:1}
  nav .badge{position:absolute;margin:0 0 0 22px;font-size:10.5px}
  nav button{position:relative}
  .meline{display:flex!important}
  .dobar{position:static}
  .card{padding:14px;border-radius:12px}
  .grid,.fields{grid-template-columns:1fr}
  button{min-height:44px}
  button.sm{min-height:40px;padding:8px 13px}
  .row{gap:8px}
  .row>button{flex:1 1 auto}
  input,select,textarea{font-size:16px;min-height:44px}
  details.cmd>summary{padding:12px 14px}
  .gz{grid-template-columns:1fr;gap:2px}
  .gz .when{padding-top:8px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  #pal{padding-top:calc(4vh + env(safe-area-inset-top))}
  #pall{max-height:60vh}
}
.meline{display:none;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none;font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.storytext p{margin:0 0 8px}.storytext h4{margin:10px 0 4px;font-family:var(--serif,Georgia,serif);font-weight:400;font-size:17px}.storytext .dl{color:var(--mut);font-size:13px}.storytext blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--acc);font-style:italic}.storytext ul{margin:0 0 8px;padding-left:18px}.cposter svg{box-shadow:2px 2px 0 rgba(0,0,0,.25)}.gz .cposter{margin:6px 0}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="realmName">Realm Console</h1>
    <button class="sm find" id="find" title="Find any action or page" aria-label="Find an action">🔍<span class="lbl"> Find an action…</span> <kbd>Ctrl K</kbd></button>
    <button class="sm" id="theme" title="Light, dark, or follow this PC"></button>
    <div class="me" id="meBar"><span class="live" id="live"></span><span>Not connected</span></div>
  </div>
  <div class="meline" id="meLine"></div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite" title="Click to dismiss"></div>
<div id="pal" hidden><div class="palbox" role="dialog" aria-label="Find an action">
  <input id="palq" type="search" placeholder="What do you want to do? Try: coalition, vote, send crowns…" autocomplete="off">
  <div id="pall"></div>
  <div class="small mut"><kbd>↑</kbd> <kbd>↓</kbd> to move · <kbd>Enter</kbd> to open · <kbd>Esc</kbd> to close</div>
</div></div>

g in power"},plebiscite:{name:"Plebiscite",what:"Ask every citizen to confirm you. Win and you are President with legitimacy restored. Lose and the regime ends.",cost:"Everything",types:["dictatorship"],group:"Staying in power"},heir:{name:"Name an heir",what:"If the General removes you, your heir takes over with half your legitimacy.",cost:"Free",types:["dictatorship"],arg:["target"],group:"Staying in power"},escalate:{name:"Change the regime",what:"Martial law can become a junta or a dictatorship; a junta a dictatorship or a one-party state; a President a one-party state. Never back down.",cost:"\u22123",types:["martial","junta","dictatorship"],arg:["to"],group:"Staying in power"},circuses:{name:"Bread and circuses",what:"The Treasury pays every citizen 3 crowns. Once a week.",cost:"+2",types:[...Y,"civil"],group:"Buying support"},oath:{name:"Loyalty oath",what:"Every citizen is asked to swear. Swearing pays 3 crowns and is public. Refusing is public too, and marks you.",cost:"Free",types:[...Y,"civil"],group:"Buying support"},honour:{name:"Honours for the faithful",what:"A title for a supporter. It marks them as a collaborator.",cost:"Free",types:[...Y,"civil"],arg:["target","text"],group:"Buying support"},pardon:{name:"Pardon",what:"Release a detainee or recall an exile.",cost:"+1",types:[...ie,"civil"],arg:["target"],group:"Buying support"},amnesty:{name:"Amnesty day",what:"Free every detainee at once.",cost:"+2 or more",types:[...ie,"civil"],group:"Buying support"},purge:{name:"Purge",what:"Expel a Party member. They are marked.",cost:"\u22122",types:["party"],arg:["target"],group:"Repression"},lift:{name:"Lift a decree",what:"End one of the decrees in force: the censor, the curfew, the suspension of Parliament, conscription, nationalisation, the secret police, the oath, party bans, seizures, or a rate or rule set by decree.",cost:"Free",types:["civil"],arg:["what"],group:"Lifting decrees"},peace:{name:"Make peace",what:"End the war on the front as it stands, with no terms. Bonds are repaid in full.",cost:"+1",types:[...ie,"civil"],group:"Foreign affairs"},treaty:{name:"Ratify a treaty",what:"Accept a treaty a nation has offered, without Parliament.",cost:"Free",types:[...ie,"civil"],arg:["offer"],group:"Foreign affairs"},plan:{name:"Five-year plan",what:"Promise to pay the people a sum from the Treasury in 7 days. +3 now; \u22126 if the money isn\u2019t there.",cost:"+3 now",types:["party"],arg:["n"],group:"Buying support"}};var yt=3,gt={imperial:{name:"Imperial Prerogative",text:"The Monarch reigns as Emperor or Empress, and the realm is proclaimed an Empire (taking the name \u201CThe \u2026 Empire\u201D unless it is one already). Parliament is dissolved and the Imperial Privy Council sits in its place: the Sovereign, the Imperial High Commissioner, the General, the Lord Chamberlain, the Lord Privy Seal and three Privy Councillors appointed by the Sovereign. It passes Orders in Council as Parliament passed bills, and there are no general elections while it sits. The Sovereign and the High Commissioner may force an Order through without a vote; the Sovereign, the High Commissioner, the Lord Chamberlain and the Lord Privy Seal may each veto one. The Imperial High Commission is established: the High Commissioner holds the powers of the General, runs the Imperial War Chest (which receives the empire\u2019s levies and tribute, may draw on the Treasury, trade shares and acquire companies for war production), buys the Army\u2019s equipment, governs the provinces and their governors, and may take friendly nations as protectorates. If repealed, the monarch reigns as King or Queen again, every protectorate is released, and Parliament returns with a general election."},veto:{name:"Royal Veto",text:"The Monarch may strike any bill from the order paper at any stage before it becomes law: waiting for consent, in debate, at the vote, or awaiting assent. A struck bill falls and cannot become law; bets on it are refunded. A bill to remove the head of state cannot be struck, unless the Protection of the State Act already makes its removal void."},prerogative:{name:"Royal Prerogative",text:`Every bill passed by the House waits for the Royal Assent of the Monarch, who may give it or refuse it. Nothing becomes law by convention or by the passing of time: a bill not given assent within ${yt} days lapses. Where the Government Powers Act says otherwise, this Act prevails. A bill that removes the head of state still needs no assent.`},jail:{name:"Public Order and Detention",text:"Creates the Ministry of Public Order, led by the Minister of Public Order, appointed and removed by the Prime Minister: restricted, with a budget of 20 crowns a week, and the powers to fine a citizen up to 10 crowns (as often as it likes), guard one citizen from assassins each day, detain a citizen and release a detainee. The Minister or the Prime Minister may detain any active citizen except the Prime Minister and the head of state, with no trial, charge, vote or reason, for as long as the order says or with no end date. A detainee is held in the Realm Jail: they cannot vote, stand (they are withdrawn from any election), table, edit, amend or speak on any proposal, sign anything, or found, join, lead or split a party. A detained MP keeps their seat, suspended and not filled by countback. A detainee loses every office and any party leadership. Detention does not end at an election, a change of government, the end of a season or the fall of any regime, and no pardon, asylum, court, amnesty or jailbreak releases a detainee. Only the Prime Minister or the Minister of Public Order may release one, or the repeal of this law. The Realm Jail page lists every detainee, who ordered it, and when."},decrees:{name:"Government Powers",text:"The Prime Minister may issue a decree at any time, containing anything a bill can, including changes to the constitution. It becomes law the moment it is issued, with no debate, vote, referendum or wait, and gets a law number. The Prime Minister may also issue any of the built-in regime decrees, once a day, with no legitimacy cost and no regime in place. Decrees need no assent. A bill passed by the House receives assent one hour after it passes unless the head of state signs it sooner; the head of state can no longer refuse. Where a decree and another law conflict, the decree wins, and only a later decree can amend or repeal a decree. Nothing that suspends Parliament suspends this power."},continuity:{name:"Continuity of Parliament",text:"No general election is called or held, at the end of a term or at any other time, including snap elections, dissolutions, hung Parliaments, the end of martial law or a coup, and the fall of a regime or a provisional government. Any general election open when this law passes is cancelled. Seasons still end on their normal schedule, for scoring only. The sitting MPs keep their seats indefinitely. No Speaker election is held: the Prime Minister appoints, removes and replaces the Speaker, who must not be an MP. An empty seat is not filled by countback: the Prime Minister appoints any active citizen who is not detained to it. The Prime Minister may remove any MP from their seat at any time."},unity:{name:"National Unity",text:"The party led by the Prime Minister becomes the National Party, the only legal party. Every other party is dissolved: its members become independents, and its name and colour can never be used again. No new party can be founded. A citizen joins the National Party only with the Prime Minister\u2019s approval, and the Prime Minister may expel any member. The National Party cannot split; members may leave. The Prime Minister leads it for as long as they are Prime Minister, with no challenges, contests or standing down. In any election that still takes place, only National Party members may stand. In House votes the National Party line is the Prime Minister\u2019s own vote, and an MP who votes against it is expelled from the party automatically."},crown:{name:"Crown",text:""},protection:{name:"Protection of the State",text:"Motions of no confidence can no longer be tabled; any open one is withdrawn and any confidence deadline is cancelled, and the government cannot fall for lack of confidence. The Prime Minister, ministers and the head of state cannot be censured, and their censures are cleared. No proposal can be tabled, and no amendment moved to a government proposal, without the Prime Minister\u2019s consent; only the Prime Minister can call a referendum. Demands made with a secret card against the Prime Minister or a minister are void and cannot be sent, and cards about the Prime Minister cannot be leaked. If the State Security Act is not law, every coup plot is discovered one hour after it starts, and its members are detained under the Public Order and Detention Act if it is law, or otherwise exiled indefinitely. The head of state cannot be removed or changed, nor the kind of head of state, except by decree of the Prime Minister; if the head of state leaves office, the Prime Minister appoints the next. The Prime Minister may name a Deputy, who becomes Prime Minister at once if the Prime Minister leaves office; with no Deputy, the longest-serving MP of the Prime Minister\u2019s party does. This Act and the Public Order and Detention, Government Powers, Continuity of Parliament, National Unity, Press and Information and State Security Acts can only be amended or repealed by decree of the Prime Minister."},press:{name:"Press and Information",text:"A newspaper can only publish while it holds a licence from the Ministry of Public Order. Existing papers lose their licence unless the Ministry renews it within 24 hours, and the Ministry can withdraw any licence at any time. The Prime Minister or the Minister of Public Order can remove any published story or debate speech, with no Gazette entry. A secret card about a member of the government cannot be leaked; a citizen who tries is detained under the Public Order and Detention Act if it is law. Formal questions to ministers and questions at Prime Minister\u2019s Questions are only published if the Prime Minister approves them."},security:{name:"State Security",text:"While the post of Director of the Security Service is vacant, the Prime Minister holds all of its powers, and may make two investigations a day. A coup needs two more plotters than the rules otherwise require, and never fewer than four. Every coup launch goes to the 12-hour contested night. On that night the government side gets +3 for loyal security forces, the Prime Minister counts 2, and every minister counts as declared for the government unless they declare otherwise. When any plot reaches three members, the Prime Minister is told privately that a plot of that size exists, but not who is in it. Plotters caught by a raid or discovery, and plotters in a failed coup, are detained under the Public Order and Detention Act if it is law. A minister who joins a plot loses their post the moment it is discovered or launched."}};gt.crown={name:"Crown",text:"The head of state is also the Prime Minister, at all times, and holds every power of that office. There is no separate Prime Minister: whoever holds the post leaves office when this becomes law, and nobody else can be invited to form a government. The Crown cannot lose the confidence of the House, and cannot resign the premiership. When a new head of state takes office, they become Prime Minister at once. While the post of head of state is empty, a government is formed as the law otherwise provides, until there is one."};var Ue=n=>Object.values(n.offices).find(t=>{var e;return(e=t.powers)==null?void 0:e.includes("imperial")});var nr=3*864e5;var br={work:12*36e5,counsel:864e5,train:864e5,broadcast:864e5,recruit:2*864e5,policy:7*864e5,command:12*36e5,audience:864e5,report:864e5,sabotage:2*864e5};var vr=3*864e5;var qr=12*36e5;var xt={victory:1.3,peace:1,defeat:.5};var w={varnholm:{capita ledge.",args:{mine:"id (your amendment)",theirs:"id (their amendment)"}},"pledge.answer":{about:"Accept or turn down a pledge offered to you.",args:{pledge:"id",yes:"bool"}},"gov.invite":{about:"Head of state: invite someone to form a government.",args:{target:"id (citizen)"}},"gov.resign":{about:"PM: resign.",args:{}},"gov.appoint":{about:"Appoint someone to an office you control. An officer of state (an office with the govern power) proposes; when there are two or more, a second officer must make the same choice.",args:{office:"id (office)",target:"id (citizen) or null"}},"gov.shadow":{about:"Opposition leader: name a shadow minister.",args:{post:"id (office)",target:"id (citizen)"}},"coalition.propose":{about:"Propose a coalition or confidence-and-supply deal.",args:{partners:"list of sides ('p:<party id>' or 'i:<citizen id>')",kind:"'full' | 'cs' (confidence and supply)",terms:"list of text"}},"coalition.sign":{about:"Sign the coalition you were offered.",args:{}},"coalition.decline":{about:"Turn down the coalition talks you were invited to, or call off talks you opened.",args:{}},"coalition.leave":{about:"Take your party out of the coalition.",args:{}},"coalition.promise":{about:"Promise an office to a coalition partner.",args:{office:"id (office)",target:"id (citizen)"}},"hos.honour":{about:"Head of state: give an honour.",args:{target:"id (citizen)",title:"text"}},"hos.title":{about:"Monarch: choose King or Queen (under the Imperial Prerogative Act, Emperor or Empress).",args:{title:"'King' | 'Queen' | 'Emperor' | 'Empress'"}},"crown.style":{about:"Monarch, before the coronation: choose a regnal name, King or Queen, and the oath.",args:{name:"text",title:"'King' | 'Queen' | 'Emperor' | 'Empress'",oath:"'parliament' | 'people' | 'crown'"}},"crown.hold":{about:"Monarch: hold the coronation now instead of waiting.",args:{}},"crown.homage":{about:"For a day after a coronation: swear homage to the monarch, or publicly refuse.",args:{swear:"boolean"}},"crown.abdicate":{about:"Monarch: offer the throne to an heir (they have a day to answer), or leave it empty.",args:{heir:"id (citizen), optional"}},"crown.withdraw":{about:"Monarch: take back an offer to abdicate.",args:{}},"crown.heir":{about:"Answer an offer of the throne.",args:{yes:"boolean"}},"crown.claim":{about:"Having refused homage (or as a monarch who lost the throne): claim the throne as a pretender. Once every 10 days.",args:{manifesto:"text, optional (up to 240)"}},"crown.back":{about:"Publicly back a pretender's claim.",args:{}},"crown.unback":{about:"Stop backing the claim before it is settled (\u22121 approval).",args:{}},"crown.withdrawClaim":{about:"The pretender: give up the claim.",args:{}},"crown.recognise":{about:"The pretender: ask a nation to recognise your claim (+2 weight). Once per nation per claim; unfriendly nations say yes more often.",args:{nation:"id"}},"crown.rally":{about:"The monarch, once per claim: a royal proclamation (+2 weight to the throne). Costs the monarch 20.",args:{}},"crown.parley":{about:"The monarch: offer the pretender a dukedom and a purse (0\u2013100, from your wallet, held until they answer) to drop the claim.",args:{crowns:"number"}},"crown.terms":{about:"The pretender: accept or refuse the monarch's terms.",args:{yes:"boolean"}},"gov.command":{about:'Under the Government Powers Act, the Prime Minister: enact a tabled bill at once by decree ("by Royal Command"), without a vote. The bill\u2019s stage becomes commanded.',args:{prop:"id (proposal)"}},"crown.strike":{about:"Under the Royal Veto Act, the reigning monarch: strike a pending bill from the order paper. It falls and cannot become law; bets are refunded. Not a bill to remove the head of state.",args:{prop:"id (proposal)"}},"crown.whip":{about:"Reigning monarch: set a public line on a bill before the House. MPs who vote against it lose 2 approval when the vote closes.",args:{prop:"id (proposal)",line:"'aye' | 'no' | 'none'"}},"crown.emeritus":{about:"Reigning monarch: grant the Office of the Monarch Emeritus to someone who has reigned before (grant true), or take it away (grant false). It holds any number of past monarchs, each with a royal pension, an honour and a style.",args:{target:"id (citizen)",grant:"bool (optional, default true)"}},"crown.toast":{about:"Raise a loyal toast to the crowned monarch, once a day. Earns 1 Influence.",args:{}},"hos.pardon":{about:"Head of state: pardon an exile.",args:{target:"id (citizen)"}},"prop.new":{about:"Table a proposal. See proposals.ts for kinds and clause shapes.",args:{kind:"'bill' | 'no_confidence' | 'confidence' | 'censure' | 'referendum' | 'dissolution'",title:"text",clauses:"list of clause objects (bills). t: 'text' | 'office' | 'abolish' | 'budget' | 'set' | 'permit' | 'treaty' | 'breakTreaty' | 'repeal' | 'constitution' | 'removeHos' | 'war' | 'peace' | 'job' | 'zone' | 'jail' | 'decrees' | 'continuity' | 'unity' | 'protection' | 'press' | 'security' | 'crown' | 'prerogative' | 'veto' (the last ten are whole Acts and need no other fields). A 'text' clause keeps its line breaks (up to 3000 characters). A 'set' clause is {t:'set', key, value}: key is a SETTABLE number (taxRate, mpPay, \u2026) or any cap in LIMITS (engine/limits.ts; current values in world.config.limits, defaults where missing)",target:"id (censure)",summary:"text (optional)",fast:"bool (fast-track: half the debate and voting time, 15 Influence)",draft:"id (optional): table one of your drafts; MPs who signed this exact wording become co-sponsors"}},"prop.speak":{about:"Speak in a debate.",args:{prop:"id",side:"'for' | 'against' | 'undecided' | 'order' (Speaker)",text:"text"}},"prop.vote":{about:"Vote on a proposal.",args:{prop:"id",vote:"'aye' | 'no' | 'abstain'"}},"prop.edit":{about:"Author only, while it is being debated: change the title, summary or clauses (same shapes as prop.new). Speeches so far are marked as on the earlier draft.",args:{prop:"id",title:"text (optional)",summary:"text (optional)",clauses:"list (optional)"}},"prop.whip":{about:"Party leader, or the Chief Whip for a governing party: set your party\u2019s line on a House vote. Public.",args:{prop:"id",line:"'aye' | 'no' | 'free'"}},"prop.withdraw":{about:"Author only, before the vote closes: withdraw your proposal. Bets on it are refunded.",args:{prop:"id"}},"prop.casting":{about:"Speaker: casting vote on a tie.",args:{prop:"id",vote:"'aye' | 'no'"}},"prop.assent":{about:"Head of state: grant or refuse assent.",args:{prop:"id",yes:"bool"}},"prop.dissolve":{about:"Head of state: answer a dissolution request.",args:{prop:"id",yes:"bool"}},"prop.hasten":{about:"Monarch only, on a bill or referendum: skip the debate straight to the vote (once), or halve the time left in the debate or the vote (once each; at least 1 hour always remains).",args:{prop:"id",mode:"'skip' | 'halve'"}},"prop.block":{about:"Use a block power on a proposal.",args:{prop:"id"}},"prop.lobby":{about:"Pay an MP to lobby on a proposal (public).",args:{prop:"id",mp:"id (citizen)",amount:"number"}},"prop.amend":{about:"MPs other than the author, during the debate: propose changing, adding or removing one clause. Public.",args:{prop:"id",op:"'change' | 'add' | 'remove'",index:"clause number from 0 (change, remove)",clause:"clause object (change, add)",why:"text (optional)"}},"prop.amendment":{about:"Author, during the debate: accept or turn down an amendment. Turned down with 3 MPs backing it (the proposer counts), the House votes on it before the main vote.",args:{prop:"id",amendment:"id",accept:"bool"}},"prop.amendBack":{about:"MPs: back a waiting amendment, or take your backing back (toggles).",args:{prop:"id",amendment:"id"}},"prop.amendVote":{about:"MPs: vote on an amendment the House is dividing on. More ayes than noes when the debate ends and it goes in.",args:{prop:"id",amendment:"id",vote:"'aye' | 'no' | 'abstain'"}},"prop.amendWhip":{about:"Party leader, or the Chief Whip for a governing party: your party\u2019s line on an amendment. Public.",args:{prop:"id",amendment:"id",line:"'aye' | 'no' | 'free'"}},"draft.save":{about:"Create or update one of your drafts (private; up to 20). Changing the wording asks co-sponsors to sign again.",args:{id:"your own id, 'd' + 4\u201324 lowercase letters or digits",kind:"as prop.new",title:"text",summary:"text",clauses:"list",target:"id (censure)",fast:"bool",rev:"number (your revision counter)"}},"draft.delete":{about:"Delete one of your drafts.",args:{draft:"id"}},"draft.invite":{about:"Invite an MP to co-sponsor your draft (up to 6). They see the draft.",args:{draft:"id",who:"id (citizen)"}},"draft.uninvite":{about:"Take back a co-sponsor invitation.",args:{draft:"id",who:"id (citizen)"}},"draft.sponsor":{about:"Sign, or decline, a draft you were invited to co-sponsor. A signature counts only for the wording you signed.",args:{draft:"id",yes:"bool"}},"q.ask":{about:"Ask a question for PM's Questions.",args:{text:"text",to:"id (citizen, optional)"}},"q.back":{about:"Back a question so it rises.",args:{id:"id (question)"}},"q.answer":{about:"Answer a question put to you.",args:{id:"id (question)",text:"text"}},"office.grant":{about:"Pay a citizen from an office's budget.",args:{office:"id",target:"id (citizen)",amount:"number",reason:"text"}},"office.fine":{about:"Fine a citizen using an office with the fine power.",args:{office:"id",target:"id (citizen)",amount:"number",reason:"text"}},"money.send":{about:"Send crowns to someone.",args:{to:"id (citizen)",amount:"number",note:"text"}},"reserve.rate":{about:"Reserve chair: set the interest rate.",args:{rate:"number"}},"money.print":{about:"Chancellor or Chair of the Reserve: propose (or agree to) printing new crowns. Both must sign the same terms within 24 hours; the PM signs for a vacant post. Up to 200 a time, 400 a week. Raises prices.",args:{amount:"number",use:"'treasury' | 'debt'"}},"money.bonds":{about:"Chancellor or Chair of the Reserve: propose (or agree to) a Treasury bond issue, open for 3 days. Both must sign the same terms.",args:{rate:"number (1\u201310, % a week)",weeks:"number (1\u20138)",cap:"number (10\u20131000 crowns)"}},"money.agree":{about:"Chancellor or Chair of the Reserve: sign the printing or bond motion waiting for you (economy.motion).",args:{}},"money.gold":{about:"Chancellor or Chair of the Reserve: propose (or agree to) buying gold abroad with Treasury crowns. Gold backs printing: that much can be printed without inflation.",args:{amount:"number (10\u2013200)"}},"bond.sell":{about:"Offer one of your Treasury bonds for sale on the bond market (anonymously).",args:{bond:"id (your holding)",price:"number"}},"bond.unlist":{about:"Take your bond off the market.",args:{bond:"id"}},"bond.take":{about:"Buy a bond offered on the market (bonds.market). It is repaid to you when it matures.",args:{bond:"id"}},"bond.buy":{about:"Lend the Treasury crowns by buying bonds from the open issue (bonds.issue). Repaid with interest at maturity.",args:{amount:"number"}},"bank.open":{about:"Open a licensed bank (needs the Banking Act).",args:{name:"text",saveRate:"number",loanRate:"number"}},"bank.deposit":{about:"Deposit in a bank.",args:{bank:"id",amount:"number"}},"bank.withdraw":{about:"Withdraw from a bank.",args:{bank:"id",amount:"number"}},"bank.borrow":{about:"Borrow from a bank.",args:{bank:"id",amount:"number",weeks:"number (1-10 weeks)"}},"venture.start":{about:"Invest in a trading venture abroad (5\u2013100).",args:{nation:"id",amount:"number"}},"foreign.envoy":{about:"Send an envoy to a nation.",args:{nation:"id"}},"foreign.propose":{about:"Ask a nation for a treaty.",args:{nation:"id",kind:"'trade' | 'fishing' | 'defence' | 'alliance' | 'nonaggression'"}},"foreign.embassy":{about:"Foreign Minister: open an embassy (30 from the Treasury, 5 a week) or close it.",args:{nation:"id",open:"boolean"}},"foreign.embargo":{about:"Foreign Minister or PM: place a nation under trade embargo, or lift it.",args:{nation:"id",on:"boolean"}},"foreign.mediate":{about: viser or above: secretly approach a citizen at home to spy for your nation (every 2 days).",args:{target:"id (citizen)"}},"abroad.command":{about:"Defector, Minister or above, while your nation fights the realm: lead its army in the next battle (+2).",args:{}},"abroad.policy":{about:"The nation's Chancellor (a defector with the most favour, 80+), or its ruler: set its policy towards the realm, once a week (every 3 days as ruler).",args:{act:"'ultimatum' | 'sanction' | 'aid' | 'war' | 'peace'"}},"abroad.marry":{about:"Defector in a monarchy (Varnholm, the Orrin Isles), favour 50+: propose marriage into the royal family (every 2 days).",args:{}},"abroad.bid":{about:"Defector: make a bid to rule the nation (every 3 days). Monarchies: claim the succession as a consort (60+). Republics: stand for election (65+), spending 0\u2013100 on the campaign. Austrava: buy the guilds for 120 (50+). Drakmoor: seize power (65+); failure gets you thrown out.",args:{spend:"number (0\u2013100, elections only)"}},"abroad.offer":{about:"A defector who rules a nation: offer the realm a treaty, which its House can ratify by bill.",args:{kind:"'trade' | 'fishing' | 'defence' | 'alliance' | 'nonaggression'"}},"abroad.abdicate":{about:"A defector who rules a nation: give it up.",args:{}},"abroad.child":{about:"A royal consort abroad: hope for an heir (even chance, every 2 days). Name the child.",args:{name:"text"}},"abroad.dynasty":{about:"A defector with a royal heir abroad: press a dynastic claim to the realm's throne in the child's name. Their nation recognises it (+2). Win, and you come home to be crowned.",args:{}},"abroad.intrigue":{about:"Defector: intrigue against a rival at the same court, once a day: steal favour, or expose one of their carried secrets.",args:{target:"id (citizen)",kind:"'steal' | 'expose'"}},"asylum.claim":{about:"Under a coup, a regime or a law to jail citizens: shelter in a friendly nation\u2019s embassy, out of reach of arrest. You cannot take part in politics while there.",args:{nation:"id"}},"asylum.leave":{about:"Leave the embassy.",args:{}},"exile.declare":{about:"Defector, Adviser or above: declare a government in exile (w.exileGov), the realm's rightful government. One at a time.",args:{name:"text"}},"exile.join":{about:"Join the government in exile (defectors in the same nation), or back it publicly from home (\u22122 approval).",args:{}},"exile.leave":{about:"Leave the government in exile, or stop backing it. Its leader leaving dissolves it.",args:{}},"exile.return":{about:"Leader of the government in exile, with members and backers of at least a quarter of the realm (3 or more): lead it home. The exiles return and a coup night begins, backers declared for them. Once a week.",args:{}},"agent.answer":{about:"Answer a secret approach from a foreign power: accept (you become its agent and are paid), refuse, or refuse and report it.",args:{approach:"id (approach)",yes:"boolean",report:"boolean (optional)"}},"agent.leak":{about:"A foreign agent: leak a card you can see to your paymasters (10 crowns).",args:{card:"id (card)"}},"agent.quit":{about:"A foreign agent: stop working for them (you can still be caught for two weeks).",args:{}},"abroad.settle":{about:"Defector: move into a better home in your new capital (1 townhouse 30, 2 manor 80, 3 palace apartment 150, Minister and above; you pay the difference). More favour each time you serve the court; a manor or better is harder to snatch.",args:{level:"1 | 2 | 3"}},"abroad.naturalise":{about:"Defector: swear allegiance to your new nation (after 5 days, 40 favour, 20 crowns). The realm can no longer extradite you; coming home costs more approval. Not for plants.",args:{}},"abroad.audience":{about:"Defector: answer the court's business of the day (see businessFor in engine/abroad.ts; one matter a day, flavoured by the nation).",args:{choice:"number (option index)"}},"abroad.report":{about:"A plant of the Security Service: send a report home (a secret card for the PM and the Director). Once a day; a small chance the courier is caught.",args:{}},"abroad.sabotage":{about:"A plant, Adviser and above: sabotage the host nation's army (\u22120.5 strength). Every 2 days; 1 in 5 chance of being unmasked.",args:{}},"defector.extradite":{about:"The PM or the Foreign Minister: ask a defector's host nation to hand them back. Friendlier nations oblige more often; not for naturalised defectors or foreign rulers. Refusal cools the nation. Once every 3 days per defector.",args:{target:"id (citizen)"}},"defector.seize":{about:"The Chancellor (or the PM with no Chancellor): seize half a defector's wallet for the Treasury, once a defection.",args:{target:"id (citizen)"}},"defector.amnesty":{about:"The PM: offer a defector an amnesty (on: true) or withdraw it (on: false). Under amnesty they come home with no approval loss and no border hold.",args:{target:"id (citizen)",on:"bool"}},"intel.discredit":{about:"Director of the Security Service: a whispering campaign against a defector at their new court (15 from the budget, once a day). Usually costs them 8\u201314 favour.",args:{target:"id (citizen)"}},"intel.snatch":{about:"Director of the Security Service: send a snatch squad to bring a defector home by force (40 from the budget). Harder against high-ranking or well-housed defectors; failure is a public scandal.",args:{target:"id (citizen)"}},"intel.plant":{about:"Director of the Security Service: ask a citizen, in private, to defect to a nation on the Service's orders (30 cover money from the budget, held until they answer; the offer lapses in 2 days).",args:{target:"id (citizen)",nation:"id"}},"plant.answer":{about:"Answer the Security Service's private request to defect as its plant. Yes: you defect at once, publicly, with the 30 crowns of cover money.",args:{plant:"id",yes:"bool"}},"abroad.turn":{about:"A plant the court has found out: agree to work for the host nation (yes: true; your reports home become false, your sabotage staged, and you are its agent), or refuse and be thrown out. Only you see the offer (w.citizens[me].defected.turnOffer).",args:{yes:"bool"}},"abroad.wanted":{about:"A Chancellor or ruler abroad: put a price on a home official's head, paid from the nation's treasury (10 to the wantedMax limit, held in escrow for 5 days). One every 3 days.",args:{target:"id (citizen)",reward:"number"}},"wanted.claim":{about:"Try to seize the official on a wanted poster and carry them over the border (one try per poster). Success: the reward, and they are held hostage abroad. Failure: three days held, \u22125 approval.",args:{wanted:"id"}},"exile.paper":{about:"Defector: found the exile paper for your court (one per nation). Every defector there can write for it.",args:{name:"text (4\u201340)"}},"exile.write":{about:"Defector: write for your court's exile paper. Each week its most-cheered story is printed in the Gazette at home. Same formatting as press.submit.",args:{headline:"text (5\u2013120)",body:"text (up to the storyLength limit)",poster:"optional poster id, as press.submit"}},"exile.invade":{about:"Defector, Minister and above, at a hostile court (or one ruled by a defector) with enough defectors (invasionDefectors limit): begin preparing an invasion of the homeland. Public.",args:{name:"text (4\u201360)"}},"exile.muster":{about:"Defector at the same court: join the invasion being prepared.",args:{}},"exile.fund":{about:"A member of the invasion: put crowns in its chest (refunded if it is called off).",args:{amount:"number (1\u2013500)"}},"exile.drill":{about:"A member of the invasion: drill the force, once a day. Two drills add 1 to its strength.",args:{}},"exile.standDown":{about:"The invasion's leader: call it off and refund the chest.",args:{}},"exile.launch":{about:"The invasion's leader, after 2 days of preparation: the exiles land, the host declares war, and a 12-hour contested night begins with the foreign troops counted for the invaders.",args:{}},"intel.disrupt":{about:"Director of the Security Service: sabotage the exiles' muster (25 from the budget, once a day). Usually sets them back.",args:{}},"trial.vote":{about:"A justice of the Supreme Court, or a juror drawn by lot: find the accused guilty or not guilty. Votes are secret until the verdict.",args:{trial:"id",verdict:"'guilty' | 'innocent'"}},"trial.defend":{about:"The accused: speak in your own defence.",args:{trial:"id",text:"text (8\u20131000)"}},"crown.proclaim":{about:"The crowned monarch: a proclamation, once a day. It is shown on every page for 24 hours (w.crown.proclamation).",args:{text:"text (8\u2013240)"}},"crown.ennoble":{about:"The crowned monarch: make a citizen a Baron, Earl or Duke (up to the peers limit). Peers draw an appanage each week and stand by the Crown on a coup night.",args:{target:"id (citizen)",rank:"'baron' | 'earl' | 'duke'",of:'text, optional (the place in the title: "Kingsmead" makes them Duke of Kingsmead; 3\u201330 letters, unique; default: an estate name nobody holds as a title, kept on promotion)'}},"crown.attaint":{about:"The crowned monarch: strip a peer of their title.",args:{target:"id (citizen)"}},"crown.progress":{about:"The crowned monarch: a royal progress through a province (15 from the Treasury, every 3 days). No unrest there for a week; stability +1.",args:{province:"id"}},"crown.triumph":{about:"The monarch or the Imperial High Commissioner, within 3 days of a victory: a triumph in the capital (30 from the war chest or Treasury). Citizens line the streets for 12 hours.",args:{}},"triumph.cheer":{about:"Line the streets for a triumph: +1 Influence, +1 approval.",args:{}},"crown.lese":{about:"An absolute monarch (Royal Prerogative or Royal Veto Act, or the empire): charge a citizen with l\xE8se-majest\xE9. They are tried; guilty means 3 days in the Realm Jail. Every 2 days.",args:{target:"id (citizen)",text:"text (the charge, 8\u2013200)"}},"crown.propose":{about:"The crowned monarch: propose marriage to a citizen. They have a day to answer (w.crown.proposal).",args:{target:"id (citizen)"}},"crown.wed":{about:"Answer the monarch's proposal. Yes: a royal wedding, a national holiday (2 crowns to everyone), and you are Royal Consort (5 a week).",args:{yes:"bool"}},"crown.divorce":{about:"The crowned monarch: divorce the consort (\u22123 approval, stability \u22121).",args:{}},"crown.child":{about:"Retired: royal heirs at home were removed. Always refused.",args:{name:"text"}},"crown.tower":{about:"An absolute monarch: commit a citizen convicted at trial in the last 14 days to the Tower: jailed with no end, title and estates forfeit.",args:{target:"id (citizen)"}},"crown.towerRelease":{about:"The crowned monarch: release a prisoner from the Tower.",args:{target:"id (citizen)"}},"tower.escape":{about:"Bribe the Tower guards to free a prisoner (10 crowns, once a day each). Every try in the last 3 days makes the next likelier; 3 in 10 failed tries are caught (held 3 days).",args:{target:"id (citizen)"}},"durbar.attend":{about:"Pay homage at the Imperial Durbar (each payday under the empire, for 24 hours): +1 Influence. Governors, peers, Privy Councillors and the High Commissioner who stay away lose 2 approval and are named.",args:{}},"crown.grant":{about:"The crowned monarch: grant a Crown estate (ESTATES in engine/dynasty.ts; w.holdings) to a peer. It pays them its rent each week.",args:{estate:"id",target:"id (citizen, a peer)"}},"crown.resume":{about:"The crowned monarch: take an estate back from a peer (\u22122 approval for them).",args:{estate:"id"}},"estate.palace":{about:"Build a palace on an estate you hold (60 crowns; the monarch builds on Crown land from the Treasury): +3 rent a week.",args:{estate:"id"}},"abroad.stir":{about:"Defector, Adviser and above: stir up a province the realm holds (every 2 days). At 3 agitation it revolts; unanswered in 2 days it breaks away to the nation that claims it.",args:{province:"id"}},"imperial.suppress":{about:"The High Commissioner (or the PM): answer a revolt by sending troops (odds better with a garrison, fort, governor and a big Army; failure loses the province) or making concessions (the levy is lifted, calm for a week).",args:{province:"id",how:"'troops' | 'concede'"}},"abroad.succession":{about:"A defector with a royal child abroad: put the child's claim on the ballot of an open election for the monarch. Win, and you come home to take the throne in the child's name.",args:{election:"id"}},"estate.host":{about:"The holder of an estate with a palace (the monarch for Crown palaces): hold a hunt (15) or a ball (20), every 3 days, inviting 1\u201310 citizens at home. Open for 24 hours; invited guests who stay away are named.",args:{estate:"id",kind:"'hunt' | 'ball'",guests:"list of citizen ids"}},"event.attend":{about:"An invited guest: come to a hunt or ball (w.events): +2 Influence, +1 approval for you and the host.",args:{event:"id"}},"estate.raise":{about:"A peer whose estates the Crown took back in the last 14 days: arm your tenants (10 crowns). For 7 days they count +1 per estate lost (up to 3) for your side on any coup night.",args:{}},"poster.commission":{about:"The Imperial High Commissioner (or the PM): commission a poster with your own slogan (10 from your purse, once a day). It is on every page for 3 days (w.commission).",args:{slogan:"text (6\u201348)",font:"'imperial' | 'propaganda' | 'condensed' | 'gothic' | 'fatface' | 'slab' | 'classic' (optional)",palette:"'porphyry' | 'khaki' | 'navy' | 'blood' | 'realm' | 'steel' (optional)"}},"poster.deface":{about:"Under a coup regime, anyone outside it: scrawl on one of the posters (once a day). Legitimacy \u22121; 1 in 4 are caught and held a day. Who wrote it stays secret unless caught (w.defaced).",args:{poster:"id: 'lend' | 'march' | 'cannon' | 'calls' | 'firm' | 'eagle' | 'waves' | 'skies' | 'horse' | 'fields' | 'silence' | 'forge' | 'fallen' | 'kess-cross' | 'kess-gold' | 'kess-valley' | 'decree'",text:"text (2\u201330)"}},"abroad.signPoster":{about:"A defector at the enemy's court in wartime: sign one of its posters (once a day). +3 favour; stability at home \u22121. Signatures are public (w.army.campaign.enemyPosters).",args:{poster:"'gohome' | 'unbroken'"}},"intel.sweep":{about:"Director of the Security Service: sweep for a nation\u2019s agents and rings (20 from the budget, once a day).",args:{nation:"id"}},"hostage.ransom":{about:"PM, Chancellor or Foreign Minister: pay 40 from the Treasury to bring a hostage home early.",args:{hostage:"id (hostage)"}},"exchange.donate":{about:"The shareholder whose revolt got its way: direct a 20-crown donation from the company to a party.",args:{prop:"id",sym:"id (company symbol)",party:"id"}},"imperial.levy":{about:"Imperial High Commissioner: levy tribute on a province the empire holds (10 crowns a week; more unrest), or lift it.",args:{province:"id (province)",on:"boolean"}},"imperial.governor":{about:"Imperial High Commissioner: appoint a citizen Governor of a province (paid 5 a week; halves the chance it rises), or recall them (target empty).",args:{province:"id (province)",target:"id (citizen), or null to recall"}},"imperial.protectorate":{about:"Imperial High Commissioner, under the Imperial Prerogative Act: ask a friendly nation to become a protectorate (tribute of 10 a week, its army fights beside ours). Once a week per nation.",args:{nation:"id"}},"imperial.release":{about:"Imperial High Commissioner: release a protectorate.",args:{nation:"id"}},"governor.decree":{about:"A Governor: issue a decree for your province, once every three days: festival, works (public works, from your own pocket), crackdown, tribute, or militia (a free regiment, once a week).",args:{province:"id (province)",kind:"'festival' | 'works' | 'crackdown' | 'tribute' | 'militia'"}},"imperial.requisition":{about:"Imperial High Commissioner: move money from the Treasury into the war chest (100 a week at most).",args:{crowns:"number 1\u2013100"}},"imperial.repay":{about:"Imperial High Commissioner: give money back from the war chest to the Treasury.",args:{crowns:"number"}},"imperial.trade":{about:"Imperial High Commissioner: buy or sell shares of one of the ten companies for the war chest. Holding 25 gives control.",args:{sym:"string (company symbol)",n:"number of shares",sell:"boolean"}},"imperial.acquire":{about:"Imperial High Commissioner: buy a controlling stake (25 shares, at a 20% premium) in a company, from the war chest.",args:{sym:"string (company symbol)"}},"imperial.direct":{about:"Imperial High Commissioner: give a company the war chest controls an order: dividends, war (war production) or requisition.",args:{sym:"string",order:"'dividends' | 'war' | 'requisition'"}},"army.procure":{about:"General, High Commissioner or PM: buy for the Army: artillery, cavalry, ironclad, airship, or a fort in a province we hold. Paid from the war chest if it can, else the Treasury; weekly upkeep.",args:{item:"'artillery' | 'cavalry' | 'ironclad' | 'airship' | 'fort'",province:"id (province), for a fort"}},"army.scrap":{about:"General, High Commissioner or PM: stand down one piece of equipment (or a fort) to save its upkeep.",args:{item:"string",province:"id (province), for a fort"}},"privy.appoint":{about:"The Sovereign: appoint (or, with no target, dismiss) one of the three Privy Councillors.",args:{seat:"0 | 1 | 2",target:"id (citizen) or null"}},"privy.summon":{about:"Lord Chamberlain: summon the Privy Council to an urgent sitting; an Order in debate goes to the vote within the hour. Once a day.",args:{prop:"id (proposal)"}},"oath.swear":{about:"Under the Imperial Prerogative Act: swear the Imperial Oath of allegiance (+5 Influence). Not having sworn costs nothing.",args:{}},"oath.refuse":{about:"Refuse the Imperial Oath: you lose every office, Council seat and governorship you hold, and cannot be appointed again until you swear.",args:{}},"privy.force":{about:"The Sovereign or the Imperial High Commissioner: force a pending Order in Council through; it becomes law at once, without a vote.",args:{prop:"id (proposal)"}},"privy.veto":{about:"The Sovereign, the High Commissioner, the Lord Chamberlain or the Lord Privy Seal: veto a pending Order in Council; it falls.",args:{prop:"id (proposal)"}},"privy.seal":{about:"Lord Privy Seal: set the Imperial Seal on an Order waiting for assent, so it takes effect within the hour.",args:{prop:"id (proposal)"}},"war.terms":{about:"MPs, while the enemy's terms of peace are on the table (army.campaign.terms): accept or reject. A majority of votes cast after a day makes peace on those terms.",args:{yes:"boolean"}},"war.memorial":{about:"MPs, after a war: choose whose names go on the memorial (w.memorials). A name backed by a majority of MPs voting is carved.",args:{memorial:"id (memorial)",names:"list of ids (citizens)"}},"army.garrison":{about:"The PM, the General or an officer of state: post a regiment to a province we hold (it cannot rise while garrisoned), or withdraw it.",args:{province:"id (province)",on:"boolean"}},"intel.ring":{about:"Director of the Security Service: plant a spy ring in a nation (60 from the Service's budget). Each payday it reports their army and their next move; 1 in 6 chance a week it is rolled up.",args:{nation:"id"}},"exchange.motion":{about:"Holding at least 5 shares and a tenth of a company's citizen-held shares: call a shareholder vote on whether the company lobbies for or against a bill.",args:{sym:"id (company symbol)",prop:"id (proposal)",side:"'aye' | 'no'"}},"exchange.vote":{about:"A shareholder: vote on an open shareholder motion, weighted by your shares.",args:{motion:"id (sharemotion: w.exchange.motions)",yes:"boolean"}},"war.embed":{about:"A newspaper editor, in wartime: send a correspondent to the front (10 crowns, once per war). Your paper prints a dispatch after every battle; dispatches count double for the front page.",args:{paper:"id"}},"army.march":{about:"The General: march the Army on the capital, starting a 12-hour coup night with the Army behind you (+3). Only as a war hero, or when Army loyalty is 2 or less; not while on the advance; once every 14 days.",args:{}},"exchange.float":{about:"Float your own company or bank on the Exchange (25 crowns). Sales from the float pay the company (or the bank's reserves).",args:{kind:"'company' | 'bank'",sym:"text (3\u20134 letters)",name:"text (company only)",sector:"text (optional)",about:"text (optional)",shares:"number (50\u20131000)",price:"number (1\u201350)",keep:"number (shares you keep, a tenth at least)",capital:"number (20\u2013500, company only)"}},"exchange.invest":{about:"Owner of a listed company: put more of your own money into it.",args:{sym:"id (company symbol)",amount:"number"}},"exchange.dividend":{about:"Owner of a listed company or bank: pay a dividend from its funds, shared by every share in hands.",args:{sym:"id (company symbol)",amount:"number"}},"exchange.oust":{about:"A big enough shareholder in a citizen-floated company: call a vote to remove its owner. Carried, the largest holder who voted for it takes over.",args:{sym:"id (company symbol)"}},"exchange.buy":{about:"Buy shares on the Exchange at the posted price, plus stamp duty.",args:{sym:"id (company symbol)",n:"number"}},"exchange.sell":{about:"Sell shares on the Exchange at the posted price.",args:{sym:"id (company symbol)",n:"number"}},"exchange.halt":{about:"Chair of the Reserve: halt trading for 12 hours (once a day).",args:{}},"exchange.duty":{about:"Chancellor: set stamp duty on share purchases, 0\u20135%.",args:{rate:"number"}},"deal.offer":{about:"Offer someone a private deal.",args:{to:"id (citizen)",text:"text"}},"deal.answer":{about:"Accept or refuse a deal.",args:{id:"id (deal)",yes:"bool"}},"deal.expose":{about:"Expose a deal you are part of.",args:{id:"id (deal)"}},"card.leak":{about:"Leak a card you can see, optionally to a paper.",args:{card:"id",paper:"id (optional)"}},"card.use":{about:"Use a card as leverage on its subject.",args:{card:"id",ask:"'pay' | 'vote' | 'resign'"}},"card.burn":{about:"Destroy a card you hold.",args:{card:"id"}},"demand.answer":{about:"Answer a demand made with a card.",args:{id:"id (demand)",how:"'comply' | 'expose'"}},"plot.start":{about:"Start a plot (20 Influence).",args:{name:"text"}},"plot.invite":{about:"Invite someone into your plot.",args:{plot:"id",target:"id (citizen)"}},"plot.answer":{about:"Answer a plot invitation: join it, stay silent (refuse and keep the secret), report it (ends the plot), or inform (join, and tell the Security Service). Without `how`, join true joins and false stays silent.",args:{plot:"id",join:"bool",how:"'join' | 'silent' | 'report' | 'inform' (optional)"}},"plot.pay":{about:"Plotter: pay into the war chest (150 crowns fills it). Refunded if the plot is called off.",args:{plot:"id",amount:"number"}},"plot.backer":{about:"Plot leader: ask a nation to back the coup. Once per nation.",args:{plot:"id",nation:"id"}},"plot.raid":{about:"Head of the Security Service (or the PM if there is none): raid a plot you have an informer inside.",args:{plot:"id"}},"security.investigate":{about:"Director of the Security Service: learn whether one person is in a plot. One a day; only you see the answer (world.probes).",args:{target:"id (citizen)"}},"coup.declare":{about:"During a coup night (world.coup): declare for the coup or against it. Public.",args:{side:"'coup' | 'gov'"}},"coup.defect":{about:"Plotter, during a coup night: change sides. You are spared if it fails.",args:{}},"coup.flee":{about:"The ousted Prime Minister: flee abroad (true) or stay and face the regime (false).",args:{flee:"bool"}},"regime.form":{about:"Leader of a coup, within 6 hours of taking power: choose how to rule.",args:{type:"'martial' | 'junta' | 'dictatorship'"}},"regime.decree":{about:"Leader of a regime: issue a decree, one a day. A junta\u2019s council must approve it.",args:{kind:"'censorship' | 'curfew' | 'dissolve' | 'police' | 'arrest' | 'exile' | 'ban' | 'trial' | 'seize' | 'nationalise' | 'tax' | 'rate' | 'conscription' | 'postpone' | 'rigged' | 'rewrite' | 'plebiscite' | 'heir' | 'escalate' | 'circuses' | 'oath' | 'honour' | 'pardon' | 'amnesty' | 'purge' | 'plan'",target:"id (citizen), where the decree names someone",party:"id (ban)",bank:"id (seize, nationalise)",n:"number (arrest: days; tax, rate: percent; plan: crowns)",to:"'junta' | 'dictatorship' | 'party' (escalate)",key:"'voting' | 'passRule' | 'termDays' (rewrite)",value:"the new value (rewrite)",text:"text (honour: the title)"}},"regime.council":{about:"Member of a junta\u2019s council: vote on the decree before it.",args:{yes:"bool"}},"regime.censor":{about:"The regime: print or strike a story held by the censor.",args:{story:"id",allow:"bool"}},"regime.oath":{about:"Swear or refuse the loyalty oath. Both are public.",args:{swear:"bool"}},"regime.apply":{about:"One-party state: apply for a Party card.",args:{}},"regime.admit":{about:"Chairman: admit or refuse an applicant.",args:{target:"id (citizen)",yes:"bool"}},"regime.strike":{about:"Sign the general strike against a regime, or take your name off it. Who has signed is secret.",args:{}},"regime.verdict":{about:"Say whether you believe the regime\u2019s show trial.",args:{believe:"bool"}},"regime.vote":{about:"Vote in a dictator\u2019s plebiscite.",args:{yes:"bool"}},"regime.palace":{about:"Move against the leader of the regime from inside: the council, Party members, or (against a dictator) the General.",args:{}},"regime.free":{about:"Party member in a one-party state: vote to restore free elections.",args:{}},"regime.leak":{about:"Council member or secret police chief: reveal that the regime\u2019s election is rigged. The regime falls.",args:{}},"regime.exit":{about:"Leader of a regime: offer to hand back power in return for amnesty.",args:{}},"regime.exitAnswer":{about:"Head of state: accept or refuse the regime\u2019s offer to go.",args:{yes:"bool"}},"police.probe":{about:"Chief of the secret police: learn whether one person has signed the strike, written underground or joined a plot. One a day.",args:{target:"id (citizen)"}},"prison.letter":{about:"Detained: write one letter a day. It is printed in the Gazette.",args:{text:"text (8\u2013500)"}},"prison.break":{about:"Help break a detainee out. It takes two people.",args:{target:"id (citizen)"}},"press.underground":{about:"Under censorship: print an unsigned pamphlet. Three times in ten the author is named.",args:{headline:"text",body:"text"}},"transition.form":{about:"Leader of a provisional government: choose its kind.",args:{kind:"'unity' | 'caretaker' | 'council' | 'regency'"}},"transition.act":{about:"Leader of a provisional government: declare an amnesty, bar the regime\u2019s people from office, or open its files.",args:{act:"'amnesty' | 'lustrate' | 'truth'"}},"transition.claim":{about:"Declare a rival government during a provisional one (10 Influence).",args:{}},"transition.back":{about:"Back the provisional leader or a rival claimant.",args:{who:"id (citizen)"}},"jail.detain":{about:"Under the Public Order and Detention Act, the Prime Minister or the Minister of Public Order: detain a citizen in the Realm Jail. No end date unless you give days.",args:{target:"id (citizen)",days:"number 1\u2013365 (optional)"}},"jail.release":{about:"The Prime Minister or the Minister of Public Order: release a detainee from the Realm Jail.",args:{target:"id (citizen)"}},"gov.decree":{about:"Under the Government Powers Act, the Prime Minister: make law by decree, at once. Clauses as for a bill (prop.new). Only a later decree can repeal a decree.",args:{title:"text",summary:"text (optional)",clauses:"list of clause objects"}},"gov.edict":{about:"Under the Government Powers Act, the Prime Minister: issue a built-in regime decree (once a day, or as many as config.edictsPerDay allows), with no regime and no legitimacy cost. `kinds` says what each kind does and which args it needs. Arrest someone with kind 'arrest', target and n (days, 1\u20132). kind 'lift' with `what` ends /* Bill text laid out like a printed bill: the same rules as the site (web/src/ui.tsx BillText). Never parsed as HTML. */
function billHtml(text) {
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  const out = [];
  for (const raw of String(text || '').replace(/\r/g, '').split('\n')) {
    const l = raw.trim(); let m;
    if (!l) { if (out.length && out[out.length - 1].k !== 'gap') out.push({ k: 'gap' }); continue; }
    const prev = out[out.length - 1];
    if (prev && /^[a-z]/.test(l) && prev.k === 'sec') { prev.k = 'num'; prev.mark += '.'; prev.t += ' ' + l; continue; }
    if (prev && /^[a-z]/.test(l) && ['p', 'num', 'sub', 'bullet', 'pre'].includes(prev.k)) { prev.t += ' ' + l; continue; }
    if ((m = l.match(/^#{1,3}\s+(.*)$/))) out.push({ k: 'head', t: m[1] });
    else if ((m = l.match(/^((?:article|section|part|chapter|schedule|clause|title)\s+(?:\d{1,3}|[IVXLC]{1,7}|[A-Z]))\b\s*[.:—–-]?\s*(.*)$/i)) && m[2].length <= 90) out.push({ k: 'head', mark: m[1], t: m[2] });
    else if (l.length <= 80 && /[A-Z]/.test(l) && l === l.toUpperCase() && !/^\(|^\d/.test(l)) out.push({ k: 'title', t: l });
    else if (/^(whereas|be it (?:therefore )?enacted|now,? therefore)\b/i.test(l)) out.push({ k: 'pre', t: l });
    else if ((m = l.match(/^(\d{1,3}\.\d{1,3}(?:\.\d{1,3})?)\.?\s+(.+)$/))) out.push({ k: 'sub', mark: m[1], t: m[2], d: 1 });
    else if ((m = l.match(/^(\d{1,3})([.)]?)\s+(.+)$/))) out.push(m[3].length <= 90 && !/[.;:,!?]$/.test(m[3]) ? { k: 'sec', mark: m[1], t: m[3] } : { k: 'num', mark: m[1] + (m[2] || '.'), t: m[3] });
    else if ((m = l.match(/^(\(\d{1,3}\))\s*(.*)$/))) out.push({ k: 'sub', mark: m[1], t: m[2], d: 1 });
    else if ((m = l.match(/^(\((?:[ivx]{1,5}|[a-z])\)|(?:[ivx]{1,5}|[a-z])[.)])\s*(.+)$/))) out.push({ k: 'sub', mark: m[1], t: m[2], d: 2 });
    else if ((m = l.match(/^([-–•▪●]|\*(?!\*))\s+(.+)$/))) out.push({ k: 'bullet', mark: '•', t: m[2] });
    else out.push({ k: 'p', t: l });
  }
  while (out.length && out[out.length - 1].k === 'gap') out.pop();
  if (out.length === 1 && out[0].k === 'p') return inl(out[0].t);
  return `<div class="bill">${out.map(b => b.k === 'gap' ? '<div style="height:6px"></div>'
    : b.k === 'head' ? `<div class="b-head">${b.mark ? `<span style="color:var(--acc)">${esc(b.mark)}</span> ` : ''}${inl(b.t)}</div>`
    : b.k === 'title' ? `<div class="b-title">${esc(b.t)}</div>`
    : b.k === 'pre' ? `<div class="b-pre">${inl(b.t)}</div>`
    : b.k === 'p' ? `<div>${inl(b.t)}</div>`
    : `<div class="b-row" style="padding-left:${b.k === 'sub' ? (b.d === 2 ? 44 : 22) : b.k === 'bullet' ? 8 : 0}px"><span class="b-mark">${esc(b.mark)}</span><span>${inl(b.t)}</span></div>`).join('')}</div>`;
}

    case 'office': return c.template ? `Creates the ${OFFICE_TEMPLATES[c.template] || c.template}.` : `Creates the office of ${c.office?.name}.`;

    case 'fund': return `The wealth fund ${c.sell ? 'sells' : 'buys'} up to ${c.crowns} crowns of ${coName(c.sym)} shares.`;

    default: return ACTS[c.t] ? 'Enacts the ' + ACTS[c.t] : CLAUSE_TYPES[c.t] || c.t;
  }
}

      ${amHos && canAct() && past.length ? `<div class="row" style="margin-top:8px">${past.map(id => `<button class="sm aye" data-do="crown.emeritus" data-a='${JSON.stringify({ target: id })}'>Grant to ${esc(who(id))}</button>`).join('')}</div>` : ''}
    </div>`; })()}

function electionCard(e) {

    <div class="row" style="margin-top:6px">${c.options.map((o, i) => `<button class="sm ${c.votes?.[W.viewer] === i ? 'p' : ''}" ${canAct() ? `data-do="convention.vote" data-a='${JSON.stringify({ clause: c.id, option: i })}'` : 'disabled'}>${esc(o)}</button>`).join('')}</div></div>`).join('') || '<div class="empty">Every clause is settled.</div>'}</div>`;

let GQ = '', GKIND = '';
const dayOf = ms => {
  const d = new Date(ms).toDateString();
  return d === new Date().toDateString() ? 'Today' : d === new Date(Date.now() - 864e5).toDateString() ? 'Yesterday' : new Date(ms).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
};
/* full = the Gazette page: filtered by the search box and the chips, grouped by day. */
const FX_GLYPH = { oath: '✋', oathcall: '✠', refuse: '✖', sworn: '♛', council: '♛', empire: '♛', appoint: '✠', governor: '⚜', gdecree: '✎', force: '✎', veto: '✖', seal: '◉', summon: '♪', invade: '⚔', invaded: '⚔', orders: '⚑', battle: '⚔', victory: '❦', defeat: '✝', memorial: '❦', march: '⚑', raise: '⚔', procure: '⚙', acquire: '❖', production: '⚙', protectorate: '⚑', levy: '⛁' };
function gazetteList(n, full) {
  const ws = full ? GQ.toLowerCase().trim().split(/\s+/).filter(Boolean) : [];
  const g = (W.gazette || []).filter(x => !full || ((!GKIND || x.kind === GKIND || (GKIND === 'moments' && x.fx)) && ws.every(w => String(x.text).toLowerCase().includes(w)))).slice(0, n);
  if (!g.length) return `<div class="empty">${full && (GQ || GKIND) ? 'Nothing in the record matches that.' : 'No news yet.'}</div>`;
  let last = '';
  return `<div class="gz">${g.map(x => {
    const d = full ? dayOf(x.at) : '', head = d !== last ? `<span class="day">${esc(d)}</span>` : ''; last = d;
    const when = full ? new Date(x.at).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : ago(x.at);
    return `${head}<span class="when" title="${esc(new Date(x.at).toLocaleString())}">${when}</span><span${x.fx ? ' class="moment"' : ''}>${x.fx ? `<span class="fx" title="A ceremony on the site">${FX_GLYPH[x.fx.k] || '✠'}</span> ` : ''}${esc(x.text)}${x.via ? ` <span class="tag">via ${esc(x.via)}</span>` : ''}${x.practice ? ' <span class="tag warn">practice</span>' : ''}${x.poster ? posterBox(x.poster, 110, 'none') : ''}</span>`;
  }).join('')}</div>`;
}

/* ---------------------------------------------------------------- the house */
const PRIVY_SEATS = ['The Sovereign', 'Imperial High Commissioner', 'The General', 'Lord Chamberlain', 'Lord Privy Seal', 'Privy Councillor', 'Privy Councillor', 'Privy Councillor'];
function oathCard() {
  const o = W.oath;
  if (!o) return '';
  const sov = W.hos?.holder;
  const him = /^(King|Emperor)$/.test(W.config?.hosTitle || '');
  const people = coll(W.citizens).filter(([id, c]) => c.active !== false && !c.bot && id !== sov);
  const sworn = people.filter(([id]) => o.sworn?.[id]), refused = people.filter(([id]) => o.refused?.[id] && !o.sworn?.[id]), waiting = people.filter(([id]) => !o.sworn?.[id] && !o.refused?.[id]);
  const owe = W.viewer !== sov && !o.sworn?.[W.viewer];
  const names = xs => xs.map(([, c]) => esc(c.name)).join(', ') || 'nobody';
  return `<div class="card" style="border-color:#C9A13B"><h2>The Imperial Oath <span class="sub">swearing earns 5 Influence · refusing costs every office</span></h2>
    <p style="font-style:italic;margin:0 0 8px">I swear that I will be faithful and bear true allegiance to ${him ? 'His' : 'Her'} Imperial Majesty${sov ? ' ' + esc(W.config.hosTitle) + ' ' + esc(who(sov)) : ''}, ${him ? 'his' : 'her'} heirs and successors, and that I will serve ${esc(W.config.realmName)} according to its laws, in Council and out of it.</p>
    ${owe ? `<div class="row">${btn('oath.swear', {}, 'I swear it', 'aye')}${o.refused?.[W.viewer] ? '' : btn('oath.refuse', {}, 'I refuse', 'no', 'Refuse the Imperial Oath? You lose every office you hold, and cannot be appointed until you swear.')}</div><p class="small mut">Not having sworn yet costs nothing.</p>` : W.viewer === sov ? '<p class="small mut">The oath is sworn to you.</p>' : '<p class="small">You have sworn it.</p>'}
    <div class="small"><b>Sworn (${sworn.length}):</b> ${names(sworn)}</div><div class="small"><b>Yet to swear (${waiting.length}):</b> ${names(waiting)}</div><div class="small"><b>Refused (${refused.length}):</b> ${names(refused)}</div></div>`;
}
/* Pickers that survive a live redraw: the choice is kept in PICKS, so an update arriving between choosing and
   clicking cannot reset it (it used to fall back to the first option). */
const PICKS = {};
const pickSelect = (key, rows, empty = 'Choose…') => `<select class="sm" style="width:auto;min-height:0" data-pick="${esc(key)}"><option value="">${esc(empty)}</option>${rows.map(([v, l]) => `<option value="${esc(v)}" ${PICKS[key] === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
document.addEventListener('change', e => { const s = e.target.closest?.('[data-pick]'); if (s) PICKS[s.dataset.pick] = s.value; });
function privyCard() {
  if (!W.privy) return '';
  const sov = W.hos?.holder === W.viewer;
  const people = coll(W.citizens).filter(([, c]) => c.active !== false && !c.bot && !c.defected);
  return `<div class="card" style="border-color:var(--acc)"><h2>The Imperial Privy Council <span class="sub">sits in place of Parliament · an Order needs 5 of 8</span></h2>
    ${(W.seats || []).map((id, i) => `<div class="item"><div class="row between"><span><span class="m">${['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'][i]} · ${esc(PRIVY_SEATS[i])}${id && W.seats.filter(x => x === id).length > 1 ? ` · ${W.seats.filter(x => x === id).length} votes` : ''}</span> <span class="t">${id ? esc(who(id)) : 'Vacant'}</span></span>
      ${sov && i >= 5 ? `<span class="row">${pickSelect('pc' + (i - 5), people.map(([cid, c]) => [cid, c.name]), id ? 'Replace with…' : 'Choose…')}<button class="sm" data-pcbtn="${i - 5}">Swear in</button>${id ? `<button class="sm no" data-pcout="${i - 5}">Dismiss</button>` : ''}</span>`
        : sov && i >= 2 && i <= 4 && seatOffice(i) ? `<span class="row">${pickSelect('po' + i, people.map(([cid, c]) => [cid, c.name]), id ? 'Replace with…' : 'Choose…')}<button class="sm" data-pobtn="${i}">Appoint</button></span>` : ''}</div></div>`).join('')}
    ${(() => { const mine = coll(W.offices).filter(([, o]) => o.holder === W.viewer).flatMap(([, o]) => o.powers || []);
      const force = sov || mine.includes('imperial'), veto = force || mine.includes('chamberlain') || mine.includes('seal'), summon = mine.includes('chamberlain'), seal = mine.includes('seal');
      const pending = coll(W.proposals).filter(([, p]) => p.kind === 'bill' && ['consent', 'debate', 'vote', 'assent', 'override', 'withheld'].includes(p.stage));
      return (force || veto || summon || seal) && pending.length ? `<div class="small" style="margin-top:8px"><b>Your prerogatives:</b>${pending.map(([id, p]) => `<div class="row between" style="margin-top:4px"><span>${esc(p.title)} <span class="m">${esc(STAGE[p.stage]?.[0] || p.stage)}</span></span><span>${summon && p.stage === 'debate' ? btn('privy.summon', { prop: id }, 'Summon the Council') : ''}${seal && p.stage === 'assent' && !p.sealed ? btn('privy.seal', { prop: id }, 'Set the Seal') : ''}${force ? btn('privy.force', { prop: id }, 'Force it through', 'aye', `Force “${p.title}” through? It becomes law at once.`) : ''}${veto ? btn('privy.veto', { prop: id }, 'Veto', 'no', `Veto “${p.title}”?`) : ''}</span></div>`).join('')}</div>` : ''; })()}</div>`;
}
// the offices behind seats III–V: the General, the Lord Chamberlain, the Lord Privy Seal
const seatOffice = i => i === 2 ? (W.offices?.army ? ['army', W.offices.army] : null) : coll(W.offices).find(([, o]) => o.template === (i === 3 ? 'chamberlain' : 'privyseal')) || null;
document.addEventListener('click', async e => {
