/* ---------------------------------------------------------------- parties & people */
function viewPeople() {
  const me = W.viewer, seats = W.seats || [], need = Math.floor(seats.length / 2) + 1;
  const cits = coll(W.citizens).filter(([, c]) => c?.active !== false);
  const myParty = W.citizens?.[me]?.party;
  const colour = c => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : 'var(--mut)';
  const parties = coll(W.parties).filter(([, p]) => p.status === 'active').map(([id, p]) => {
    const members = cits.filter(([, c]) => c.party === id).map(([cid]) => cid);
    return { ...p, id, members, mps: members.filter(m => seats.includes(m)).length };
  }).sort((a, b) => b.mps - a.mps || b.members.length - a.members.length);
  const sName = s => s.startsWith('p:') ? partyName(s.slice(2)) : who(s.slice(2)) + ' (independent)';
  const sLead = s => s.startsWith('p:') ? W.parties?.[s.slice(2)]?.leader : s.slice(2);
  const sSeats = s => s.startsWith('p:') ? seats.filter(m => W.citizens?.[m]?.party === s.slice(2)).length : +seats.includes(s.slice(2));
  const co = W.coalition && ['draft', 'signed'].includes(W.coalition.status) && Array.isArray(W.coalition.sides) ? W.coalition : null;
  const mySide = co?.sides.find(s => sLead(s) === me);
  const total = co ? co.sides.reduce((n, s) => n + sSeats(s), 0) : 0;
  const posts = id => coll(W.offices).filter(([, o]) => o.holder === id).map(([, o]) => o.title || o.name);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  const coalition = `<div class="card"><h2>Coalition <span class="sub">${co ? (co.status === 'signed' ? 'signed' : 'talks open: waiting for signatures') : 'none right now'} · a majority is ${need} of ${plural(seats.length, 'seat')}</span></h2>
    ${co ? `<div class="small mut">${co.kind === 'full' ? 'Full coalition' : 'Confidence and supply'}, led by ${esc(sName(co.lead))}. Together they hold ${plural(total, 'seat')}: ${total >= need ? '<b style="color:var(--ok)">a majority</b>' : '<b style="color:var(--bad)">short of a majority</b>'}.</div>
      ${co.sides.map(s => `<div class="item row between"><span><span class="t">${esc(sName(s))}</span> <span class="m">${plural(sSeats(s), 'seat')}${s.startsWith('p:') ? ' · leader ' + esc(who(sLead(s))) : ''}</span></span>${co.signed?.[s] ? '<span class="tag ok">Signed</span>' : '<span class="tag warn">Not signed yet</span>'}</div>`).join('')}
      ${co.terms?.length ? `<div class="small" style="margin-top:8px"><b>Terms</b><ol style="margin:4px 0 0;padding-left:20px">${co.terms.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>` : ''}
      <div class="row" style="margin-top:10px">
        ${canAct() && co.status === 'draft' && mySide && !co.signed?.[mySide] ? `<button class="sm p" data-do="coalition.sign" data-a='{}'>Sign it</button>` : ''}
        ${sLead(co.lead) === me ? openBtn('coalition.promise', 'Promise a post to a partner') : ''}
        ${co.status === 'signed' && mySide ? openBtn('coalition.leave', 'Walk out') : ''}
        ${openBtn('coalition.propose', 'Propose a new one (replaces this)')}
      </div>`
    : `<div class="empty">No coalition talks are open. A party leader or an independent MP can start them: pick partners, choose a full coalition or confidence and supply, and list the terms. It is a deal once every partner's leader signs.</div>
      <div class="row">${openBtn('coalition.propose', 'Propose a coalition', 'p')}</div>`}
  </div>`;

  const partyCard = `<div class="card"><h2>Parties <span class="sub">${parties.length}</span></h2>
    ${parties.map(p => `<div class="item"><div class="row between"><span class="t"><span class="dot" style="background:${colour(p.colour)}"></span>${esc(p.name)}${p.id === myParty ? ' <span class="tag">your party</span>' : ''}</span><span class="small mut">${p.mps} of ${plural(seats.length, 'seat')} · ${plural(p.members.length, 'member')}</span></div>
      <div class="meter"><i style="width:${seats.length ? p.mps / seats.length * 100 : 0}%;background:${colour(p.colour)}"></i></div>
      <div class="m" style="margin-top:4px">Led by ${esc(who(p.leader))}${p.members.length > 1 ? ' · ' + p.members.filter(m => m !== p.leader).map(m => esc(who(m))).join(', ') : ''}</div></div>`).join('') || '<div class="empty">No parties yet.</div>'}
    <div class="row" style="margin-top:10px">${myParty ? openBtn('party.leave', 'Leave your party') : openBtn('party.join', 'Join a party') + openBtn('party.found', 'Found a party')}</div>
  </div>`;

  const people = `<div class="card"><h2>Citizens <span class="sub">${cits.length}</span></h2>
    ${cits.slice().sort((a, b) => String(a[1].name).localeCompare(String(b[1].name))).map(([id, c]) => `<div class="item row between"><span><span class="t">${esc(c.name)}</span>${id === me ? ' <span class="tag">you</span>' : ''} <span class="m">${esc(partyName(c.party))}${posts(id).length ? ' · ' + posts(id).map(esc).join(', ') : ''}</span></span>
      <span>${id === W.hos?.holder ? `<span class="tag ok">${esc(hosTitle())}</span>` : ''}${id === W.pm ? '<span class="tag ok">PM</span>' : ''}${id === W.speaker ? '<span class="tag">Speaker</span>' : ''}${seats.includes(id) ? '<span class="tag">MP</span>' : ''}${c.bot ? '<span class="tag warn">practice bot</span>' : ''}</span></div>`).join('')}
  </div>`;
  return `${coalition}<div class="grid">${partyCard}${people}</div>`;
}

function billPayload() {
  let clauses;

  else clauses = readClauses($('.billbox'));
  const a = { kind: $('#bkind').value, title: $('#btitle').value.trim(), summary: $('#bsum').value.trim() || undefined };
  if (a.kind === 'bill' || a.kind === 'referendum') a.clauses = clauses;
  if (a.kind === 'censure') a.target = $('#btarget').value;
  if ($('#bfast').checked) a.fast = true;

}
function wireBill() {

  const go = async (btn, cmd, extra = {}) => {

    if (!a.title) return show($('#bres'), false, 'Give it a title.');

let DOQ = '', DOGROUP = '';
const DANGER = /^(plot\.launch|coup|regime\.|gov\.unseat|jail\.detain|office\.resign|gov\.resign|party\.standDown|party\.leave|coalition\.leave|prop\.withdraw)/;
/* What a decree will do, in a sentence, with what it costs of today's allowance. */
function decreeBudget() {
  const per = Math.max(1, Number(W?.config?.edictsPerDay) || 1);
  const used = W?.regime?.decreeDay === Math.floor(SERVER_NOW() / 864e5) ? (W.regime.decreeCount || 1) : 0;
  return { per, used, left: Math.max(0, per - used) };
}
function plainDecree(cmd, a) {
  if (cmd === 'jail.detain') return `Detain ${who(a.target)} in the Realm Jail${a.days ? ` for ${a.days} days` : ' with no end date'}?`;
  if (cmd === 'jail.release') return `Release ${who(a.target)} from the Realm Jail?`;
  if (cmd !== 'gov.edict' && cmd !== 'regime.decree') return '';
  const k = CMDS?.[cmd]?.kinds?.[a.kind]; if (!k) return '';
  const subj = a.target ? ` ${who(a.target)}` : a.party ? ` the ${partyName(a.party)}` : a.bank ? ` ${W.banks?.[a.bank]?.name || 'the bank'}` : '';
  const extra = a.kind === 'arrest' ? ` for ${a.n || 2} day${(a.n || 2) === 1 ? '' : 's'}` : a.kind === 'lift' && a.what ? `: ${human(a.what).toLowerCase()}` : a.n != null ? ` (${a.n})` : '';
  const b = decreeBudget();
  return `${k.name}${subj}${extra}? This uses 1 of today’s ${b.per} decree${b.per === 1 ? '' : 's'} (${b.left} left).`;
}
function quickHtml() {

    : '<span class="small mut">Press ★ on an action to keep it here. The ones you used last appear too.</span>';
}

function filterDo() {

function wireDo() {
  $('#dq').oninput = () => { DOQ = $('#dq').value; DOGROUP = ''; filterDo(); };

    const form = body.querySelector('form'), btn = body.querySelector('button.p'), res = body.querySelector('[data-res]');

      });
      form.addEventListener('change', apply); apply();
    }
    const kindSel = kinds && form.querySelector('[data-arg="kind"]');
    const needs = () => (kinds?.[kindSel?.value]?.needs || []);
    if (kindSel) {
      kindSel.closest('label').insertAdjacentHTML('afterend', '<p class="small mut" data-kwhat style="grid-column:1/-1;margin:0"></p>');
      const shape = () => {
        const k = kinds[kindSel.value];
        form.querySelector('[data-kwhat]').textContent = k ? k.what + (k.needs.length ? '' : ' Needs nothing else.') : 'Choose what to decree.';
        /* the same field means different things to different decrees */
        const NAMES = { n: { arrest: 'Days (1–2)', tax: 'Income tax (%)', rate: 'Reserve rate (%)', plan: 'Crowns' }, text: { honour: 'Title to give' }, target: { seize: 'Whose funds', heir: 'Heir' }, key: { rewrite: 'Which rule' }, value: { rewrite: 'New value' }, what: { lift: 'Which decree to lift' } };
        form.querySelectorAll('[data-arg]').forEach(el => {

        });
      };
      kindSel.addEventListener('change', shape); shape();
    }
    const pv = () => { body.querySelector('[data-pv]').textContent = JSON.stringify({ cmd, args: readArgs(form) }, null, 2); };
    const calm = () => { delete btn.dataset.armed; delete btn.dataset.miss; btn.textContent = 'Do it'; form.querySelectorAll('.miss').forEach(el => el.classList.remove('miss')); };
    form.addEventListener('input', () => { pv(); calm(); }); form.addEventListener('change', () => { pv(); calm(); }); pv();
    form.addEventListener('submit', e => { e.preventDefault(); btn.click(); });
    btn.onclick = async () => {

      const missing = kinds ? [{ name: 'kind' }, ...needs().map(name => ({ name }))].filter(x => a[x.name] === undefined) : args.filter(x => !x.optional && !x.nullable && x.kind !== 'bool' && a[x.name] === undefined && !form.querySelector(`[data-arg="${CSS.escape(x.name)}"]`)?.closest('[hidden]'));

}

const isFM = () => W?.pm === W?.viewer || coll(W?.offices).some(([, o]) => o.holder === W.viewer && (o.powers || []).includes('envoy'));

const isHC = () => coll(W?.offices).some(([, o]) => o.holder === W.viewer && (o.powers || []).includes('imperial')) || (W?.pm === W?.viewer && !coll(W?.offices).some(([, o]) => (o.powers || []).includes('imperial') && o.holder));
const reigning = () => W?.config?.hos === 'monarchy' && W.crown?.reign?.id === W.viewer && !!W.crown.reign.crownedAt;
const absolute = () => W?.config?.hos === 'monarchy' && !!(W.acts?.prerogative || W.acts?.veto || W.acts?.imperial);
const inTower = c => !!c?.jail?.tower && c.jail.until == null;
const atHomeList = () => coll(W?.citizens).filter(([id, c]) => c.active !== false && !c.bot && !c.defected && id !== W.viewer);
const hashStr = s => [...s].reduce((h, ch) => (Math.imul(h, 31) + ch.charCodeAt(0)) | 0, 7) >>> 0;
const businessFor = (id, nation) => { const list = BUSINESS.filter(b => !b.only || b.only.includes(nation)); return list[hashStr(id + ':' + Math.floor(NOW() / DAYMS)) % list.length]; };

// banners at the top of Home: proclamations, triumphs, revolts, the Durbar, a proposal, an invasion
function crownBanners() {
  const out = [], pr = W.crown?.proclamation, t = W.triumph, me = W.citizens?.[W.viewer] || {};
  if (pr && pr.until > NOW() && W.config?.hos === 'monarchy') out.push(`<div class="card" style="border-color:var(--acc)"><h2>By order of ${esc(pr.title)} ${esc(who(pr.by))} <span class="sub">${until(pr.until)}</span></h2><p>“${esc(pr.text)}”</p></div>`);
  if (t && !t.done && t.until > NOW()) out.push(`<div class="card" style="border-color:var(--bad)"><h2>A triumph <span class="sub">${until(t.until)} · ${t.crowd.length} in the crowd</span></h2><p class="small">The Army marches through the capital after the victory over ${esc(W.nations?.[t.nation]?.name)}${t.hero ? `, ${esc(who(t.hero))} at its head` : ''}.</p>${!me.defected && !t.crowd.includes(W.viewer) ? `<div class="row">${btn('triumph.cheer', {}, 'Line the streets')}</div>` : ''}</div>`);
  Object.entries(W.provinces || {}).filter(([, p]) => p.revolt).forEach(([id, p]) => out.push(`<div class="card" style="border-color:var(--bad)"><h2>${esc(PROVINCE_NAMES[id] || id)} is in revolt <span class="sub">answer ${until(p.revolt.until)} or lose it</span></h2><p class="small">Stirred up from abroad by ${esc(who(p.revolt.by))}.</p>${isHC() ? `<div class="row">${btn('imperial.suppress', { province: id, how: 'troops' }, 'Send troops', 'no')}${btn('imperial.suppress', { province: id, how: 'concede' }, 'Make concessions')}</div>` : ''}</div>`));
  const d = W.durbar;
  if (d && !d.done && d.until > NOW() && !me.defected && W.hos?.holder !== W.viewer) out.push(`<div class="card" style="border-color:var(--acc)"><h2>${d.coronation ? 'The Coronation Durbar' : 'The Imperial Durbar'} <span class="sub">${until(d.until)} · ${d.attended.length} have come</span></h2><p class="small">${d.expected.includes(W.viewer) ? 'You are summoned. Absence is noted' + (d.coronation ? ', and the Crown will not ennoble anyone who stood apart.' : '.') : 'The court sits to receive homage.'}</p>${!d.attended.includes(W.viewer) ? `<div class="row">${btn('durbar.attend', {}, 'Pay homage')}</div>` : ''}</div>`);
  const pp = W.crown?.proposal;
  if (pp && pp.to === W.viewer && pp.until > NOW()) out.push(`<div class="card" style="border-color:var(--acc)"><h2>${esc(hosTitle())} ${esc(who(pp.by))} asks for your hand <span class="sub">${until(pp.until)}</span></h2><div class="row">${btn('crown.wed', { yes: true }, 'Accept', 'aye')}${btn('crown.wed', { yes: false }, 'Decline', 'no')}</div></div>`);
  coll(W.events).filter(([, v]) => !v.done && v.until > NOW() && v.guests.includes(W.viewer) && !v.came.includes(W.viewer)).forEach(([id, v]) => out.push(`<div class="card"><h2>${esc(who(v.host))} invites you to ${esc(EVENTS[v.kind]?.name)} at ${esc(ESTATES[v.estate]?.name)} <span class="sub">${until(v.until)}</span></h2><p class="small">+2 influence if you go. Staying away is noticed.</p><div class="row">${btn('event.attend', { event: id }, 'Go')}</div></div>`));
  if (W.invasion && !me.defected) out.push(`<div class="card" style="border-color:var(--bad)"><h2>Invasion warning <span class="sub">${esc(W.invasion.name)}</span></h2><p class="small">The exiles are preparing to invade from ${esc(W.nations?.[W.invasion.nation]?.name)}: ${W.invasion.members.length} under arms, ${W.invasion.drills} drills, a chest of ${W.invasion.chest}. Ready ${until(W.invasion.readyAt) || 'now'}.</p>${isSec() ? `<div class="row">${btn('intel.disrupt', {}, 'Disrupt the muster (25)', 'no')}</div>` : ''}</div>`);
  return out.join('');
}

  }).join('')}</div>`;
}

/* ═════════════════════════════════════════════ the press: formatted stories, posters, bylines, letters */
// WhatsApp-style formatting, as on the site (web/src/StoryText.tsx): escaped first, so only these tags can appear
const fmtInline = (s) => esc(s)
  .replace(/\*\*([^*\n]+?)\*\*/g, '<b>$1</b>')
  .replace(/\*(\S(?:[^*\n]*?\S)?)\*/g, '<b>$1</b>')
  .replace(/(^|[^\p{L}\p{N}])_(\S(?:[^_\n]*?\S)?)_(?=$|[^\p{L}\p{N}])/gu, '$1<i>$2</i>')
  .replace(/~(\S(?:[^~\n]*?\S)?)~/g, '<s>$1</s>');
const plainHead = (s) => String(s || '').replace(/^\s*[*_~]+|[*_~]+\s*$/g, '').replace(/\*\*?([^*]+)\*\*?/g, '$1');
function fmtStory(text) {
  return String(text || '').replace(/\r/g, '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => {
    const lines = p.split('\n');
    if (lines.every(l => /^\s*[-•]\s+/.test(l))) return `<ul>${lines.map(l => `<li>${fmtInline(l.replace(/^\s*[-•]\s+/, ''))}</li>`).join('')}</ul>`;
    if (lines.every(l => /^\s*>\s?/.test(l))) return `<blockquote>${lines.map(l => fmtInline(l.replace(/^\s*>\s?/, ''))).join('<br>')}</blockquote>`;
    if (lines.length === 1 && /^#{1,3}\s+/.test(p)) return `<h4>${fmtInline(p.replace(/^#{1,3}\s+/, ''))}</h4>`;
    if (lines.length === 1 && /^\*\*?[^*]+\*\*?$/.test(p)) return `<h4>${fmtInline(p.replace(/^\*\*?|\*\*?$/g, ''))}</h4>`;
    if (lines.length === 1 && /^_[^_]+_$/.test(p)) return `<p class="dl"><i>${fmtInline(p.slice(1, -1))}</i></p>`;
    return `<p>${lines.map(fmtInline).join('<br>')}</p>`;
  }).join('');
}
// a poster, drawn by the site's own code (RealmPosters, bundled in above) and fitted once the fonts are in

function posterSvg(p) {

  } catch { return ''; }
}

/* ═════════════════════════════════════════════ find anything (Ctrl K) */
let PALI = 0, PALROWS = [];
function palDraw() {
  const ws = $('#palq').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const pages = Object.entries(VIEWS).map(([v, l]) => ({ t: l, s: 'Page', h: [v], k: ('page ' + l).toLowerCase() }));
  const cmds = Object.entries(CMDS || {}).map(([c, i]) => ({ t: cmdTitle(c), s: i.about, h: ['do', c], k: searchKey(c, i), c }));
  const fav = [...new Set([...listOf('pins'), ...listOf('recent')])];
  /* Best first: words found in the action's own name beat words found only in its description or group. */
  const score = x => { const own = ((x.c || '') + ' ' + x.t).toLowerCase(); return ws.filter(w => own.includes(w)).length; };
  PALROWS = ws.length ? [...cmds, ...pages].filter(x => ws.every(w => x.k.includes(w))).sort((a, b) => score(b) - score(a)).slice(0, 14) : [...fav.map(c => cmds.find(x => x.c === c)).filter(Boolean), ...pages];
  PALI = Math.max(0, Math.min(PALI, PALROWS.length - 1));
  $('#pall').innerHTML = PALROWS.map((x, i) => `<button data-i="${i}" class="${i === PALI ? 'on' : ''}"><b>${esc(x.t)}</b><span>${esc(x.s)}</span></button>`).join('') || '<div class="empty" style="padding:8px 10px">Nothing matches. Try another word.</div>';
  $('#pall .on')?.scrollIntoView({ block: 'nearest' });
}
function palOpen() { if (!W) return; $('#pal').hidden = false; $('#palq').value = ''; PALI = 0; palDraw(); $('#palq').focus(); }
function palClose() { $('#pal').hidden = true; }
function palGo(i) { const x = PALROWS[i]; if (!x) return; palClose(); go(...x.h); }
$('#find').onclick = palOpen;
$('#palq').oninput = () => { PALI = 0; palDraw(); };
$('#palq').onkeydown = e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); PALI = (PALI + (e.key === 'ArrowDown' ? 1 : -1) + PALROWS.length) % (PALROWS.length || 1); palDraw(); }
  if (e.key === 'Enter') { e.preventDefault(); palGo(PALI); }
};
$('#pal').onclick = e => { const b = e.target.closest('[data-i]'); if (b) palGo(+b.dataset.i); else if (e.target.id === 'pal') palClose(); };
document.addEventListener('keydown', e => {

/* ═════════════════════════════════════════════ live updates (long-poll) */
let LOOPING = false, CONN = 'off';
async function loop() {
  if (LOOPING) return; LOOPING = true; CONN = 'live'; header();
  while (LOOPING && KEY) {
    try {
      const d = await api(`/state?since=${VERSION}&wait=25`, null, { quiet: true });
      if (CONN !== 'live') { CONN = 'live'; header(); }
      if (d?.version !== undefined && d.version !== VERSION) { absorb(d); await refreshAlerts(); render(); }
    } catch (e) {
      if (e.status === 401) { LOOPING = false; toast('Your key stopped working. Connect again with a new one.', true); break; }
      if (CONN !== 'retry') { CONN = 'retry'; header(); }
      await new Promise(r => setTimeout(r, 5000));
    }
  }
  LOOPING = false; CONN = 'off'; header();
}
/* Countdowns tick on their own; nothing is redrawn. */
setInterval(() => document.querySelectorAll('[data-until]').forEach(el => { el.textContent = left(+el.dataset.until); }), 30000);
